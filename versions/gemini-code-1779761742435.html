                    'coral-pink': '#ff4f6a', 'canary-yellow': '#ffcc00', 'space-gray': '#555559', 'silver': '#e3e4e6',
                    'gold': '#f9e4b7', 'purple': '#d1cddb', 'mint-green': '#addece', 'product-red': '#d92632',
                    'pacific-blue': '#2b4353', 'slate-graphite': '#38393d', 'sierra-blue': '#a7c1d6', 'alpine-green': '#4f5d4e',
                    'midnight': '#1a232e', 'starlight': '#faf6f0', 'quite-black': '#2c2c2e', 'very-silver': '#e5e5ea',
                    'not-pink': '#f7d6d0', 'clearly-white': '#fcfcfc', 'stormy-black': '#3a3a3c', 'sorta-seafoam': '#bdf0e2',
                    'obsidian': '#1c1a17', 'porcelain': '#f3f0eb', 'bay-blue': '#8ab4f8', 'aloe': '#9bf1c4', 'hazel': '#5a6157'
                };
                return colors[this.color] || '#333';
            }

            toggleFlipChassis() {
                this.flipped = !this.flipped;
                if(this.flipped) {
                    this.domElement.classList.add('flipped');
                } else {
                    this.domElement.classList.remove('flipped');
                }
            }

            bindEvents() {
                let dragStart = {x:0, y:0};
                const onMouseDown = (e) => {
                    if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.classList.contains('hardware-sim-tray-bracket') || e.target.classList.contains('flip-tab')) return;
                    e.stopPropagation();
                    dragStart.x = e.clientX; dragStart.y = e.clientY;
                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                };
                const onMouseMove = (e) => {
                    const dx = (e.clientX - dragStart.x) / Workspace.zoom;
                    const dy = (e.clientY - dragStart.y) / Workspace.zoom;
                    dragStart.x = e.clientX; dragStart.y = e.clientY;
                    if (Workspace.selectedNodes.includes(this)) {
                        Workspace.selectedNodes.forEach(node => {
                            node.x += dx; node.y += dy;
                            node.domElement.style.left = `${node.x}px`;
                            node.domElement.style.top = `${node.y}px`;
                            if(node.updateCoordsHud) node.updateCoordsHud();
                        });
                    } else {
                        this.x += dx; this.y += dy;
                        this.domElement.style.left = `${this.x}px`;
                        this.domElement.style.top = `${this.y}px`;
                        this.updateCoordsHud();
                    }
                };
                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };
                this.domElement.addEventListener('mousedown', onMouseDown);

                // Hardware simulation side tray mechanics interaction
                const tray = this.domElement.querySelector('.hardware-sim-tray-bracket');
                tray.addEventListener('click', (e) => {
                    if(e.target.tagName === 'SELECT') return;
                    tray.classList.toggle('expanded');
                });

                // Application launcher event bindings
                this.domElement.querySelectorAll('.app-icon').forEach(icon => {
                    icon.addEventListener('click', () => {
                        this.switchApp(icon.getAttribute('data-launch'));
                    });
                });
                this.domElement.querySelectorAll('.app-close').forEach(btn => {
                    btn.addEventListener('click', () => this.switchApp('launcher'));
                });

                // Telephony interaction setup
                const dialOutput = this.domElement.querySelector('.dialer-output');
                this.domElement.querySelectorAll('.dial-btn').forEach(btn => {
                    btn.addEventListener('click', () => dialOutput.innerText += btn.innerText);
                });
                this.domElement.querySelector('.phone-clear-trigger').addEventListener('click', () => dialOutput.innerText = '');
                this.domElement.querySelector('.phone-call-trigger').addEventListener('click', () => {
                    const target = dialOutput.innerText.trim();
                    if(!this.currentSim) {
                        alert("NO SIM CARD DETECTED inside expansion bracket tray registry mapping.");
                        return;
                    }
                    if(!target) return;
                    this.domElement.querySelector('.phone-call-trigger').style.display = 'none';
                    this.domElement.querySelector('.dialer-pad').style.display = 'none';
                    const stateBox = this.domElement.querySelector('.active-call-state');
                    stateBox.style.display = 'block';
                    stateBox.querySelector('.call-status-label').innerText = "ROUTING LINK SIGNAL...";
                    
                    const res = NetworkHub.initiateCall(this.currentSim, target, this.id);
                    if(res === "FAILED") {
                        stateBox.querySelector('.call-status-label').innerText = "UNREACHABLE ROUTE";
                    } else if(res === "BUSY") {
                        stateBox.querySelector('.call-status-label').innerText = "CIRCUIT BUSY CONFIG";
                    } else {
                        this.activeCallData = { role: 'caller', targetNumber: target };
                    }
                });
                this.domElement.querySelector('.phone-hangup-trigger').addEventListener('click', () => this.hangupCall(true));
                
                this.domElement.querySelector('.accept-btn').addEventListener('click', () => {
                    if(this.activeCallData && this.activeCallData.peerPhoneId) {
                        NetworkHub.connectCall(this.id, this.activeCallData.peerPhoneId);
                    }
                });
                this.domElement.querySelector('.decline-btn').addEventListener('click', () => this.hangupCall(true));

                // Messaging window action mapping rules
                this.domElement.querySelector('.back-to-threads-btn').addEventListener('click', () => {
                    this.domElement.querySelector('[data-view="chat"]').style.display = 'none';
                    this.domElement.querySelector('[data-view="threads"]').style.display = 'flex';
                    this.renderThreadsList();
                });
                this.domElement.querySelector('.sms-new-thread-btn').addEventListener('click', () => {
                    const numInput = this.domElement.querySelector('.sms-target-input');
                    const num = numInput.value.trim();
                    if(!num) return;
                    this.activeChatNumber = num;
                    this.domElement.querySelector('[data-view="threads"]').style.display = 'none';
                    this.domElement.querySelector('[data-view="chat"]').style.display = 'flex';
                    this.renderChatWindow(num);
                    numInput.value = '';
                });
                this.domElement.querySelector('.sms-send-trigger').addEventListener('click', () => {
                    const input = this.domElement.querySelector('.sms-input-field');
                    const message = input.value.trim();
                    if(!message || !this.currentSim || !this.activeChatNumber) return;
                    const simulatedTarget = this.activeChatNumber;
                    
                    if(!NetworkHub.sims[this.currentSim].messages[simulatedTarget]) {
                        NetworkHub.sims[this.currentSim].messages[simulatedTarget] = [];
                    }
                    NetworkHub.sims[this.currentSim].messages[simulatedTarget].push({ direction: 'sent', text: message });
                    
                    this.renderChatWindow(simulatedTarget);
                    NetworkHub.routeSMS(this.currentSim, simulatedTarget, message, this.id);
                    input.value = '';
                });

                // Contacts interaction handler binding
                this.domElement.querySelector('.contact-save-btn').addEventListener('click', () => {
                    const nameIn = this.domElement.querySelector('.contact-name-input');
                    const numIn = this.domElement.querySelector('.contact-num-input');
                    const name = nameIn.value.trim();
                    const num = numIn.value.trim();
                    if(!name || !num) return;
                    this.contactsList.push({ name, number: num });
                    nameIn.value = ''; numIn.value = '';
                    this.refreshContactsDisplay();
                });

                // Netspace dynamic multi-tab handling rules
                this.domElement.querySelectorAll('.soc-tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.domElement.querySelectorAll('.soc-tab-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.socialTab = btn.getAttribute('data-tab');
                        this.evalSocialAppTabState();
                    });
                });

                this.domElement.querySelector('.soc-login-btn').addEventListener('click', () => {
                    const hInput = this.domElement.querySelector('.soc-handle-input');
                    const val = hInput.value.trim();
                    if(!val.startsWith('@') || val.length < 3) {
                        alert("Handle must start with @ protocol syntax.");
                        return;
                    }
                    this.activeSocialUser = val;
                    if(!NetworkHub.socialAccounts[val]) {
                        NetworkHub.socialAccounts[val] = { handle: val, pass: "123" };
                    }
                    this.renderSocialAppView();
                });

                this.domElement.querySelector('.soc-blast-btn').addEventListener('click', () => {
                    const pInput = this.domElement.querySelector('.soc-post-input');
                    const txt = pInput.value.trim();
                    if(!txt || !this.activeSocialUser) return;
                    NetworkHub.publishSocialPost(this.activeSocialUser, txt, this.id);
                    pInput.value = '';
                });

                this.domElement.querySelector('.soc-dm-send-btn').addEventListener('click', () => {
                    const recIn = this.domElement.querySelector('.soc-dm-recipient-input');
                    const txtIn = this.domElement.querySelector('.soc-dm-text-input');
                    const rec = recIn.value.trim();
                    const txt = txtIn.value.trim();
                    if(!rec || !txt || !this.activeSocialUser) return;
                    NetworkHub.sendSocialDM(this.activeSocialUser, rec, txt, this.id);
                    txtIn.value = '';
                });
            }

            updateCoordsHud() {
                const hud = this.domElement.querySelector('.hud-coords');
                if(hud) hud.innerText = `(${Math.round(this.x)}, ${Math.round(this.y)})`;
            }

            switchApp(appName) {
                this.activeApp = appName;
                this.domElement.querySelectorAll('.app-view').forEach(view => {
                    view.classList.remove('active');
                });
                const targetView = this.domElement.querySelector(`[data-app="${appName}"]`);
                if(targetView) targetView.classList.add('active');
                
                if(appName === 'settings') {
                    this.populateWifiDropdownOptions();
                } else if(appName === 'messages') {
                    this.domElement.querySelector('[data-view="chat"]').style.display = 'none';
                    this.domElement.querySelector('[data-view="threads"]').style.display = 'flex';
                    this.renderThreadsList();
                } else if(appName === 'contacts') {
                    this.refreshContactsDisplay();
                } else if(appName === 'netspace') {
                    this.renderSocialAppView();
                }
            }

            applyWallpaperGraphics() {
                const vp = this.domElement.querySelector(`#screen-viewport-${this.id}`);
                if(!vp) return;
                
                let svgContent = "";
                
                if(this.currentWallpaper === 'cyber_grid') {
                    svgContent = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23050a05'/><path d='M 40 0 L 0 0 0 40' fill='none' stroke='%2300ff00' stroke-width='0.5' stroke-opacity='0.15'/></svg>")`;
                } else if(this.currentWallpaper === 'industrial_plate') {
                    svgContent = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect width='60' height='60' fill='%231a1a1a'/><circle cx='5' cy='5' r='2' fill='%23333'/><circle cx='55' cy='5' r='2' fill='%2333///'/><circle cx='5', cy='55' r='2' fill='%23333'/><circle cx='55' cy='55' r='2' fill='%23333'/><path d='M 0 30 L 60 30 M 30 0 L 30 60' fill='none' stroke='%23252525' stroke-width='1'/></svg>")`;
                } else if(this.currentWallpaper === 'neon_pulse') {
                    svgContent = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%230b001a'/><path d='M0 50 Q 25 20, 50 50 T 100 50' fill='none' stroke='%23ff007f' stroke-width='1.5'/><path d='M0 60 Q 25 40, 50 60 T 100 60' fill='none' stroke='%237f00ff' stroke-width='1' opacity='0.5'/></svg>")`;
                } else if(this.currentWallpaper === 'model_spec') {
                    if(this.isAero) {
                        svgContent = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23223322'/><circle cx='50' cy='50' r='35' fill='none' stroke='%234caf50' stroke-width='2' stroke-dasharray='4'/></svg>")`;
                    } else {
                        svgContent = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23112233'/><polygon points='50,15 90,85 10,85' fill='none' stroke='%23007aff' stroke-width='2'/></svg>")`;
                    }
                } else {
                    vp.style.backgroundImage = "none";
                    vp.style.backgroundColor = "#000000";
                    return;
                }
                vp.style.backgroundImage = svgContent;
            }

            handleWallpaperMatrixChange(val) {
                this.currentWallpaper = val;
                this.applyWallpaperGraphics();
                NetworkHub.log("Hardware UI", `Node #${this.id} updated system wallpaper matrix to: ${val}`);
            }

            handleChatBgChange(val) {
                this.chatBackground = val;
                if(this.activeChatNumber) this.renderChatWindow(this.activeChatNumber);
            }

            applyChatViewBackground(element) {
                if(this.chatBackground === 'matrix') {
                    element.style.backgroundImage = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><rect width='30' height='30' fill='%23020a02'/><text x='5' y='20' fill='%2300ff00' font-family='monospace' font-size='8' opacity='0.2'>1 0 1</text></svg>")`;
                } else if(this.chatBackground === 'sunset') {
                    element.style.backgroundImage = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><linearGradient id='g' x1='0%25' y1='0%25' x2='0%25' y2='100%25'><stop offset='0%25' stop-color='%23401020'/><stop offset='100%25' stop-color='%23100510'/></linearGradient><rect width='100' height='100' fill='url(%23g)'/><circle cx='50' cy='100' r='30' fill='%23ff5500' opacity='0.2'/></svg>")`;
                } else {
                    element.style.backgroundImage = "none";
                    element.style.backgroundColor = "#030303";
                }
            }

            populateWifiDropdownOptions() {
                const select = this.domElement.querySelector('.settings-wifi-selector');
                if(!select) return;
                select.innerHTML = '<option value="DISCONNECTED">[ SCANNING FOR AIR OPEN TRANSCEIVERS ]</option>';
                Object.values(Workspace.routers).forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.ssid;
                    opt.innerText = `Wi-Fi Transceiver: ${r.ssid}`;
                    select.appendChild(opt);
                });
                select.value = this.connectedWifiSSID;
            }

            handleWifiLinkChange(val) {
                this.connectedWifiSSID = val;
                this.updateStatusBar();
                NetworkHub.log("Radio UI", `Device Instance #${this.id} locked logic antenna onto network lane: ${val}`);
            }

            refreshHardwareTrayMenu() {
                const select = this.domElement.querySelector('.side-sim-select');
                if(!select) return;
                select.innerHTML = '<option value="NONE">[ DISENGAGED ]</option>';
                Object.keys(NetworkHub.sims).forEach(num => {
                    const sim = NetworkHub.sims[num];
                    if(sim.allocatedTo === null || sim.allocatedTo === this.id) {
                        const opt = document.createElement('option');
                        opt.value = num;
                        opt.innerText = `SIM Slot: +1 (${num})`;
                        select.appendChild(opt);
                    }
                });
                if(this.currentSim) {
                    select.value = this.currentSim;
                }
            }

            handleSimTrayInsertion(numVal) {
                if(this.currentSim) {
                    NetworkHub.sims[this.currentSim].allocatedTo = null;
                }
                if(numVal === "NONE") {
                    this.currentSim = null;
                    NetworkHub.log("Hardware Core", `SIM Card Tray pulled. Device Node #${this.id} disconnected from radio matrix.`);
                } else {
                    this.currentSim = numVal;
                    NetworkHub.sims[numVal].allocatedTo = this.id;
                    NetworkHub.log("Hardware Core", `SIM Lock Engagement. Number +1 (${numVal}) operational on Node ID #${this.id}`);
                }
                this.updateStatusBar();
                Object.values(Workspace.devices).forEach(d => d.refreshHardwareTrayMenu());
            }

            updateStatusBar() {
                const tag = this.domElement.querySelector('.carrier-tag');
                const bars = this.domElement.querySelector('.signal-bars');
                const wifiTag = this.domElement.querySelector('.wifi-indicator-tag');
                
                if(this.currentSim) {
                    tag.innerText = `+1 (${this.currentSim})`;
                    bars.innerText = "▰▰▰▰";
                    bars.style.color = "#00ff00";
                } else {
                    tag.innerText = "NO LINK";
                    bars.innerText = "▱▱▱▱";
                    bars.style.color = "inherit";
                }

                if(this.connectedWifiSSID !== "DISCONNECTED") {
                    wifiTag.innerText = `📶 ${this.connectedWifiSSID.substring(0,8)}..`;
                    wifiTag.style.color = "#00ffff";
                } else {
                    wifiTag.innerText = "📶 OFF";
                    wifiTag.style.color = "inherit";
                }
            }

            triggerIncomingCall(fromNum, peerPhoneId) {
                this.activeCallData = { role: 'receiver', targetNumber: fromNum, peerPhoneId: peerPhoneId };
                const overlay = this.domElement.querySelector('.inc-call-overlay');
                overlay.querySelector('.inc-caller-id').innerText = `+1 (${fromNum})`;
                overlay.classList.add('active');
            }

            establishCallConnection() {
                this.domElement.querySelector('.inc-call-overlay').classList.remove('active');
                this.switchApp('phone');
                this.domElement.querySelector('.phone-call-trigger').style.display = 'none';
                this.domElement.querySelector('.dialer-pad').style.display = 'none';
                const stateBox = this.domElement.querySelector('.active-call-state');
                stateBox.style.display = 'block';
                stateBox.querySelector('.call-status-label').innerText = "CIRCUIT ACTIVE LOCK";
            }

            hangupCall(notifyNetwork = true) {
                if(notifyNetwork) {
                    NetworkHub.terminateCall(this.id);
                }
                this.domElement.querySelector('.inc-call-overlay').classList.remove('active');
                this.domElement.querySelector('.active-call-state').style.display = 'none';
                this.domElement.querySelector('.phone-call-trigger').style.display = 'block';
                this.domElement.querySelector('.dialer-pad').style.display = 'grid';
                this.domElement.querySelector('.dialer-output').innerText = '';
                this.activeCallData = null;
                NetworkHub.log("Switchboard", `Circuit Connection Dropped on Node Instance #${this.id}`);
            }

            receiveSMS(fromNum, text, fromAero) {
                if(this.activeApp === 'messages') {
                    this.renderThreadsList();
                    if(this.activeChatNumber === fromNum) {
                        this.renderChatWindow(fromNum);
                    }
                }
            }

            renderThreadsList() {
                const container = this.domElement.querySelector('.msg-threads');
                if(!container) return;
                container.innerHTML = '';
                if(!this.currentSim || !NetworkHub.sims[this.currentSim]) return;
                
                const threads = NetworkHub.sims[this.currentSim].messages;
                Object.keys(threads).forEach(num => {
                    const row = document.createElement('div');
                    row.className = 'thread-row';
                    row.innerText = `Line Link: +1 (${num})`;
                    row.addEventListener('click', () => {
                        this.activeChatNumber = num;
                        this.domElement.querySelector('[data-view="threads"]').style.display = 'none';
                        this.domElement.querySelector('[data-view="chat"]').style.display = 'flex';
                        this.renderChatWindow(num);
                    });
                    container.appendChild(row);
                });
            }

            renderChatWindow(num) {
                this.domElement.querySelector('.active-chat-title').innerText = `+1 (${num})`;
                const stream = this.domElement.querySelector('.chat-stream');
                stream.innerHTML = '';
                this.applyChatViewBackground(stream);

                if(!this.currentSim || !NetworkHub.sims[this.currentSim]) return;
                const msgs = NetworkHub.sims[this.currentSim].messages[num] || [];
                
                msgs.forEach(m => {
                    const el = document.createElement('div');
                    el.className = 'chat-bubble';
                    if(m.direction === 'sent') {
                        el.classList.add('sent');
                        el.innerText = m.text;
                    } else {
                        el.classList.add('rcvd');
                        // Logic for bubble coloring
                        if(m.fromAero) {
                            el.classList.add('aero-lime');
                        } else {
                            el.classList.add('regular-blue');
                        }
                        el.innerText = m.text;
                    }
                    stream.appendChild(el);
                });
                stream.scrollTop = stream.scrollHeight;
            }

            refreshContactsDisplay() {
                const container = this.domElement.querySelector('.contacts-list-container');
                if(!container) return;
                container.innerHTML = '';
                this.contactsList.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'contact-entry';
                    
                    const monogramLetter = c.name.trim().charAt(0) || '?';
                    
                    div.innerHTML = `
                        <div class="contact-monogram">${monogramLetter}</div>
                        <div style="flex-grow:1;">
                            <div style="font-weight:bold; font-size:11px;">${c.name}</div>
                            <div style="color:#777; font-size:9px;">+1 (${c.number})</div>
                        </div>
                        <button class="contact-call-now-btn" style="padding:2px 6px; font-size:9px;">CALL</button>
                    `;
                    
                    div.querySelector('.contact-call-now-btn').addEventListener('click', () => {
                        this.switchApp('phone');
                        this.domElement.querySelector('.dialer-output').innerText = c.number;
                    });
                    
                    container.appendChild(div);
                });
            }

            evalSocialAppTabState() {
                const tl = this.domElement.querySelector('.soc-timeline-window');
                const dm = this.domElement.querySelector('.soc-dm-window');
                const sh = this.domElement.querySelector('.soc-shorts-window');
                
                tl.style.display = 'none';
                dm.style.display = 'none';
                sh.style.display = 'none';

                if(this.socialTab === 'timeline') {
                    tl.style.display = 'flex';
                } else if(this.socialTab === 'dms') {
                    dm.style.display = 'flex';
                    this.refreshSocialDMs();
                } else if(this.socialTab === 'shorts') {
                    sh.style.display = 'flex';
                    this.refreshSocialShorts();
                }
            }

            renderSocialAppView() {
                this.evalSocialAppTabState();
                const bar = this.domElement.querySelector('.soc-acc-bar');
                const authScreen = this.domElement.querySelector('.soc-auth-screen');
                const mainScreen = this.domElement.querySelector('.soc-main-screen');
                if(!bar) return;
                bar.innerHTML = '';

                Object.keys(NetworkHub.socialAccounts).forEach(handle => {
                    const box = document.createElement('div');
                    box.className = 'mini-avatar';
                    if(this.activeSocialUser === handle) box.className += ' active';
                    box.innerText = handle;
                    box.addEventListener('click', () => {
                        if(this.activeSocialUser) {
                            this.domElement.querySelector('.soc-dm-recipient-input').value = handle;
                        }
                    });
                    bar.appendChild(box);
                });

                if(!this.activeSocialUser) {
                    mainScreen.style.display = 'none';
                    authScreen.style.display = 'flex';
                    this.domElement.querySelector('.soc-dm-auth-nag').style.display = 'block';
                    this.domElement.querySelector('.soc-dm-active-box').style.display = 'none';
                } else {
                    authScreen.style.display = 'none';
                    mainScreen.style.display = 'flex';
                    this.domElement.querySelector('.soc-dm-auth-nag').style.display = 'none';
                    this.domElement.querySelector('.soc-dm-active-box').style.display = 'flex';
                    this.refreshSocialTimeline();
                }
            }

            refreshSocialTimeline() {
                const timeline = this.domElement.querySelector('.soc-timeline');
                if(!timeline) return;
                timeline.innerHTML = '';
                NetworkHub.socialPosts.forEach(post => {
                    const block = document.createElement('div');
                    block.className = 'soc-post';
                    block.innerHTML = `<div class="soc-handle">${post.sender}</div><div style="word-break:break-all;">${post.content}</div>`;
                    timeline.appendChild(block);
                });
            }

            refreshSocialDMs() {
                const stream = this.domElement.querySelector('.soc-dm-stream');
                if(!stream) return;
                stream.innerHTML = '';
                if(!this.activeSocialUser) return;
                
                const dms = NetworkHub.socialDMs[this.activeSocialUser] || [];
                dms.forEach(d => {
                    const div = document.createElement('div');
                    div.style.marginBottom = "4px";
                    div.style.fontSize = "10px";
                    div.innerHTML = `<span style="color:#ffcc00">${d.sender}:</span> ${d.text}`;
                    stream.appendChild(div);
                });
                stream.scrollTop = stream.scrollHeight;
            }

            refreshSocialShorts() {
                const container = this.domElement.querySelector('.soc-shorts-window');
                if(!container) return;
                container.innerHTML = '';
                
                NetworkHub.shortsFeed.forEach(s => {
                    const el = document.createElement('div');
                    el.className = 'short-video-container';
                    el.innerHTML = `
                        <div style="font-weight:bold; font-size:10px; color:#4caf50;">${s.creator}</div>
                        <div class="short-graphic-frame"><pre style="font-size:8px; line-height:10px;">${s.text}</pre></div>
                        <div class="short-meta">🔥 ${s.views} | [SCROLL DOWN FOR NEXT]</div>
                    `;
                    container.appendChild(el);
                });
            }

            refreshSocialFeed() {
                if(this.activeApp === 'netspace' && this.socialTab === 'timeline') {
                    this.refreshSocialTimeline();
                }
            }
        }

        // Initialize Simulator Workspace core elements on execution load
        window.onload = () => {
            NetworkHub.init();
            Workspace.init();
        };
    </script>
</body>
</html>
