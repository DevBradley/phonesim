<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network & Device Workspace Simulation</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --bg-tertiary: #1a1a1a;
            --border-color: #2a2a2a;
            --text-main: #e0e0e0;
            --text-muted: #777777;
            --accent: #555555;
            --accent-active: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Top Diagnostics Control Panel */
        #control-panel {
            height: 180px;
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            z-index: 10;
            padding: 10px;
            gap: 15px;
        }

        .panel-section {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        .panel-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 3px;
        }

        #sys-controls { width: 260px; }
        #sim-factory { width: 300px; }
        #network-logger { flex-grow: 1; }

        .log-stream {
            font-size: 11px;
            color: #00ff00;
            overflow-y: auto;
            flex-grow: 1;
            background: #050505;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }

        .log-entry { margin-bottom: 3px; white-space: nowrap; }

        button, select, input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 2px;
        }

        button:hover {
            background: var(--border-color);
            border-color: var(--text-muted);
        }

        input { cursor: text; }

        /* Workspace Grid (Infinite Pan Canvas) */
        #workspace-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #workspace-container:active { cursor: grabbing; }

        #workspace-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 5000px;
            height: 5000px;
            transform-origin: 0 0;
        }

        /* 3D Phone Chassis Styles */
        .phone-wrapper {
            position: absolute;
            perspective: 1000px;
            width: 260px;
            height: 510px;
            z-index: 5;
        }

        /* Model Scaling Layouts */
        .phone-wrapper.m-5 { width: 230px; height: 460px; }
        .phone-wrapper.m-5c { width: 230px; height: 460px; }
        .phone-wrapper.m-6 { width: 245px; height: 495px; }
        .phone-wrapper.m-7 { width: 250px; height: 490px; }
        .phone-wrapper.m-8 { width: 250px; height: 490px; }
        .phone-wrapper.m-8p { width: 265px; height: 520px; }
        .phone-wrapper.m-x { width: 265px; height: 535px; }
        .phone-wrapper.m-11 { width: 270px; height: 540px; }
        .phone-wrapper.m-12 { width: 270px; height: 540px; }
        .phone-wrapper.m-13 { width: 270px; height: 540px; }
        
        /* Aero OS Phone Chassis Sizing */
        .phone-wrapper.m-p1 { width: 235px; height: 475px; }
        .phone-wrapper.m-p3 { width: 245px; height: 495px; }
        .phone-wrapper.m-p6 { width: 260px; height: 530px; }
        .phone-wrapper.m-p8 { width: 260px; height: 530px; }
        .phone-wrapper.m-pFold1 { width: 290px; height: 510px; }
        .phone-wrapper.m-pFold2 { width: 285px; height: 525px; }
        .phone-wrapper.m-p10 { width: 265px; height: 540px; }
        .phone-wrapper.m-p10XL { width: 275px; height: 555px; }

        .phone-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .phone-wrapper.flipped .phone-card {
            transform: rotateY(180deg);
        }

        .phone-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 28px;
            border: 4px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Front Face Architecture */
        .phone-front {
            background: #111111;
            color: var(--text-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Cellular Antenna Band Engineering Lines */
        .phone-back .antenna-line.horiz-top { top: 55px; left: 0; width: 100%; height: 2px; background: rgba(0,0,0,0.3); }
        .phone-back .antenna-line.horiz-bottom { bottom: 55px; left: 0; width: 100%; height: 2px; background: rgba(0,0,0,0.3); }

        /* Chassis Framework Variant Profiles */
        .m-5 .phone-front { border-radius: 24px; }
        .m-5c .phone-front { border-radius: 26px; }
        .m-6 .phone-front { border-radius: 32px; }
        
        /* Edge to edge dynamic screens */
        .m-x .phone-front, .m-11 .phone-front, .m-12 .phone-front, .m-13 .phone-front,
        .m-p1 .phone-front, .m-p3 .phone-front, .m-p6 .phone-front, .m-p8 .phone-front,
        .m-pFold1 .phone-front, .m-pFold2 .phone-front, .m-p10 .phone-front, .m-p10XL .phone-front { 
            border-radius: 40px; padding: 4px; 
        }
        
        .m-x .top-bezel, .m-11 .top-bezel, .m-12 .top-bezel, .m-13 .top-bezel,
        .m-p1 .top-bezel, .m-p3 .top-bezel, .m-p6 .top-bezel, .m-p8 .top-bezel,
        .m-pFold1 .top-bezel, .m-pFold2 .top-bezel, .m-p10 .top-bezel, .m-p10XL .top-bezel { 
            height: 32px; background: transparent !important; z-index: 15; 
        }
        
        .notch {
            width: 110px; height: 22px; background: #000 !important; border-radius: 0 0 12px 12px;
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        /* Custom Aero camera hole pin punches */
        .aero-punch {
            width: 10px; height: 10px; background: #000; border-radius: 50%;
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
        }

        .speaker-grille { width: 35px; height: 3px; background: #222; }
        .front-cam { position: static; width: 6px; height: 6px; background: #111133; }
        
        .m-x .bottom-bezel, .m-11 .bottom-bezel, .m-12 .bottom-bezel, .m-13 .bottom-bezel,
        .m-p1 .bottom-bezel, .m-p3 .bottom-bezel, .m-p6 .bottom-bezel, .m-p8 .bottom-bezel,
        .m-pFold1 .bottom-bezel, .m-pFold2 .bottom-bezel, .m-p10 .bottom-bezel, .m-p10XL .bottom-bezel { 
            display: none !important; 
        }
        
        .m-x .screen, .m-11 .screen, .m-12 .screen, .m-13 .screen,
        .m-p1 .screen, .m-p3 .screen, .m-p6 .screen, .m-p8 .screen,
        .m-pFold1 .screen, .m-pFold2 .screen, .m-p10 .screen, .m-p10XL .screen { 
            border-radius: 34px; border: none; 
        }

        /* System Bezels */
        .top-bezel {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .bottom-bezel {
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .home-button {
            width: 34px;
            height: 34px;
            border: 1px solid #333;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle, #151515 0%, #0a0a0a 100%);
        }

        /* Screen Architecture */
        .screen {
            flex-grow: 1;
            background: #000;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .status-bar {
            height: 20px;
            background: rgba(8, 8, 8, 0.75);
            font-size: 9px;
            padding: 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(17, 17, 17, 0.3);
            color: var(--text-muted);
            z-index: 12;
        }
        .m-x .status-bar, .m-11 .status-bar, .m-12 .status-bar, .m-13 .status-bar,
        .m-p1 .status-bar, .m-p3 .status-bar, .m-p6 .status-bar, .m-p8 .status-bar,
        .m-pFold1 .status-bar, .m-pFold2 .status-bar, .m-p10 .status-bar, .m-p10XL .status-bar { 
            height: 26px; padding-top: 6px; background: rgba(0, 0, 0, 0.75); 
        }

        .status-left, .status-right { display: flex; gap: 4px; align-items: center; }

        .app-space {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* System App Containers */
        .app-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            z-index: 5;
            overflow: hidden;
        }
        .app-view.active { display: flex; }

        .app-header {
            height: 32px;
            background: #0d0d0d;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 8px;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .app-body {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px;
            display: flex;
            flex-direction: column;
            font-size: 11px;
        }

        /* Home Indicator Bar for Edge-to-Edge Layouts */
        .home-bar {
            display: none;
            width: 110px; height: 4px; background: #888; border-radius: 2px;
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            z-index: 100; cursor: pointer;
        }
        .m-x .home-bar, .m-11 .home-bar, .m-12 .home-bar, .m-13 .home-bar,
        .m-p1 .home-bar, .m-p3 .home-bar, .m-p6 .home-bar, .m-p8 .home-bar,
        .m-pFold1 .home-bar, .m-pFold2 .home-bar, .m-p10 .home-bar, .m-p10XL .home-bar { 
            display: block; 
        }

        /* OS Launcher UI Variants */
        .launcher-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
        }
        .app-icon {
            background: rgba(13, 13, 13, 0.75);
            border: 1px solid var(--border-color);
            height: 58px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 10px;
            gap: 2px;
            transition: all 0.2s ease;
        }
        .app-icon:hover { background: rgba(21, 21, 21, 0.9); }
        .app-icon span { font-size: 16px; }

        /* Aero OS Circular UI Styles Override */
        .aero-system .app-icon {
            border-radius: 50%;
            height: 70px;
            width: 70px;
            margin: auto;
            background: rgba(30, 40, 30, 0.85);
            border: 1px solid #4caf50;
        }
        .aero-system .launcher-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
        }

        /* Phone App Elements */
        .dialer-output {
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 4px;
            text-align: right;
            font-size: 14px;
            margin-bottom: 6px;
            min-height: 24px;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .dialer-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }
        .dial-btn {
            background: #0c0c0c;
            border: 1px solid #1e1e1e;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
        }
        .dial-btn:hover { background: #1a1a1a; }
        .call-actions { display: flex; gap: 5px; }

        .inc-call-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
        .inc-call-overlay.active { display: flex; }

        /* Messaging Subsystem */
        .msg-threads { display: flex; flex-direction: column; gap: 4px; }
        .thread-row {
            padding: 6px; background: #090909; border: 1px solid #151515; cursor: pointer;
        }
        .chat-stream { flex-grow: 1; overflow-y: auto; background: #030303; border: 1px solid #111; padding: 4px; margin-bottom: 4px; display: flex; flex-direction: column; background-size: cover; background-position: center; }
        .chat-bubble { max-width: 85%; padding: 4px 6px; margin-bottom: 4px; border-radius: 4px; word-break: break-all; font-size: 11px; }
        .chat-bubble.sent { background: #222; align-self: flex-end; color: #fff; }
        
        /* Directives for bubble handling color modes */
        .chat-bubble.rcvd.regular-blue { background: #007aff; align-self: flex-start; color: white; }
        .chat-bubble.rcvd.aero-lime { background: #4cd964; align-self: flex-start; color: black; font-weight: bold; }

        /* Social Network UI */
        .soc-acc-bar {
            display: flex; gap: 3px; background: #0a0a0a; padding: 4px; border-bottom: 1px solid #1a1a1a; overflow-x: auto; flex-shrink: 0;
        }
        .mini-avatar {
            font-size: 9px; padding: 2px 4px; background: #151515; border: 1px solid #333; cursor: pointer; white-space: nowrap;
        }
        .mini-avatar.active { background: #333; color: #fff; }
        .soc-post {
            background: #0a0a0a; border: 1px solid #1a1a1a; padding: 6px; margin-bottom: 6px; border-radius: 2px;
        }
        .soc-handle { color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }

        /* NetSpace Social Messaging / Shorts additions */
        .soc-tab-nav {
            display: flex; background: #111; border-bottom: 1px solid #222; flex-shrink: 0;
        }
        .soc-tab-btn {
            flex: 1; text-align: center; font-size: 9px; padding: 6px; cursor: pointer; color: #888;
        }
        .soc-tab-btn.active { color: #fff; background: #1a1a1a; font-weight: bold; }
        .soc-dm-window { display: none; flex-direction: column; flex-grow: 1; }
        .soc-shorts-window { display: none; flex-direction: column; flex-grow: 1; overflow-y: scroll; snap-type: y mandatory; }
        
        .short-video-container {
            snap-align: start; min-height: 280px; height: 280px; position: relative; border-bottom: 2px solid #222; background: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 8px;
        }
        .short-graphic-frame { flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; font-weight: bold; color: #00ff00; }
        .short-meta { font-size: 9px; color: #aaa; background: rgba(0,0,0,0.6); padding: 4px; }

        /* Physical Back Face Architecture */
        .phone-back {
            transform: rotateY(180deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-radius: 28px;
            position: relative;
        }
        
        /* Shell Finishes / Colors Rules */
        .phone-card[data-color="matte-black"] .phone-back { background: #141414; color: #888; border-color: #222; }
        .phone-card[data-color="industrial-gray"] .phone-back { background: #2e2e2e; color: #ccc; border-color: #444; }
        .phone-card[data-color="monochrome-white"] .phone-back { background: #dcdcdc; color: #222; border-color: #aaaaaa; }
        .phone-card[data-color="rose-gold"] .phone-back { background: #fad6d6; color: #444; border-color: #e0b2b2; }
        .phone-card[data-color="rose"] .phone-back { background: #ffb6c1; color: #444; border-color: #e8a2ad; }
        
        /* Model 5c Polycarbonate */
        .phone-card[data-color="neon-blue"] .phone-back { background: #00a3e0; color: #fff; border-color: #0082b3; }
        .phone-card[data-color="lime-green"] .phone-back { background: #4cd964; color: #000; border-color: #3cb252; }
        .phone-card[data-color="coral-pink"] .phone-back { background: #ff4f6a; color: #fff; border-color: #e03b54; }
        .phone-card[data-color="canary-yellow"] .phone-back { background: #ffcc00; color: #000; border-color: #e6b800; }

        /* Model 6 / 11 Architectural Paint Specs */
        .phone-card[data-color="space-gray"] .phone-back { background: #555559; color: #eee; border-color: #3a3a3c; }
        .phone-card[data-color="gold"] .phone-back { background: #f9e4b7; color: #333; border-color: #e5cb93; }
        .phone-card[data-color="silver"] .phone-back { background: #e3e4e6; color: #111; border-color: #b5b6b8; }
        .phone-card[data-color="purple"] .phone-back { background: #d1cddb; color: #222; border-color: #b7b2c5; }
        .phone-card[data-color="mint-green"] .phone-back { background: #addece; color: #111; border-color: #90c2b2; }
        .phone-card[data-color="product-red"] .phone-back { background: #d92632; color: #fff; border-color: #b51620; }

        /* Model 12 / 13 Colors */
        .phone-card[data-color="pacific-blue"] .phone-back { background: #2b4353; color: #fff; border-color: #1e303c; }
        .phone-card[data-color="slate-graphite"] .phone-back { background: #38393d; color: #eee; border-color: #252629; }
        .phone-card[data-color="sierra-blue"] .phone-back { background: #a7c1d6; color: #222; border-color: #7b94a8; }
        .phone-card[data-color="alpine-green"] .phone-back { background: #4f5d4e; color: #fff; border-color: #353f34; }
        .phone-card[data-color="midnight"] .phone-back { background: #1a232e; color: #eee; border-color: #10161e; }
        .phone-card[data-color="starlight"] .phone-back { background: #faf6f0; color: #222; border-color: #dfdcd6; }

        /* Aero-Line Real Life Specific Colorways */
        .phone-card[data-color="quite-black"] .phone-back { background: #2c2c2e; color: #eee; border-color: #1c1c1e; }
        .phone-card[data-color="very-silver"] .phone-back { background: #e5e5ea; color: #111; border-color: #c7c7cc; }
        .phone-card[data-color="not-pink"] .phone-back { background: #f7d6d0; color: #333; border-color: #e0b6b0; }
        .phone-card[data-color="clearly-white"] .phone-back { background: #fcfcfc; color: #000; border-color: #d1d1d6; }
        .phone-card[data-color="stormy-black"] .phone-back { background: #3a3a3c; color: #fff; border-color: #222; }
        .phone-card[data-color="sorta-seafoam"] .phone-back { background: #bdf0e2; color: #222; border-color: #9cd1c3; }
        .phone-card[data-color="obsidian"] .phone-back { background: #1c1a17; color: #aaa; border-color: #0c0b0a; }
        .phone-card[data-color="porcelain"] .phone-back { background: #f3f0eb; color: #222; border-color: #dbd7cf; }
        .phone-card[data-color="bay-blue"] .phone-back { background: #8ab4f8; color: #fff; border-color: #5a84c8; }
        .phone-card[data-color="aloe"] .phone-back { background: #9bf1c4; color: #222; border-color: #78ce9f; }
        .phone-card[data-color="hazel"] .phone-back { background: #5a6157; color: #fff; border-color: #434940; }

        /* Front Bezels Painting Rules */
        .phone-card[data-front-theme="black"] .phone-front { background: #0c0c0c; border-color: inherit; }
        .phone-card[data-front-theme="black"] .top-bezel, .phone-card[data-front-theme="black"] .bottom-bezel { background: #0c0c0c; color: #fff; }
        .phone-card[data-front-theme="white"] .phone-front { background: #eaeaea; border-color: inherit; color: #222; }
        .phone-card[data-front-theme="white"] .top-bezel, .phone-card[data-front-theme="white"] .bottom-bezel { background: #eaeaea; color: #222; }
        .phone-card[data-front-theme="white"] .status-bar { background: rgba(220, 220, 220, 0.85); color: #333; }

        /* Hardware Interactive Lateral Side Tray */
        .hardware-sim-tray-bracket {
            position: absolute;
            right: -12px;
            top: 160px;
            width: 12px;
            height: 48px;
            background: #222;
            border: 1px solid #444;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            z-index: 40;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.2s ease;
        }
        .hardware-sim-tray-bracket.expanded {
            width: 175px;
            right: -175px;
            height: auto;
            min-height: 55px;
            flex-direction: column;
            background: #111;
            border: 2px solid #ffcc00;
            border-radius: 4px;
            padding: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .side-tray-label {
            font-size: 8px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 3px;
            text-transform: uppercase;
            display: none;
        }
        .hardware-sim-tray-bracket.expanded .side-tray-label { display: block; }
        .side-sim-select {
            display: none;
            width: 100%;
            font-size: 10px;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 2px;
            margin-bottom: 4px;
        }
        .hardware-sim-tray-bracket.expanded .side-sim-select { display: block; }
        .side-tray-icon { font-size: 10px; color: #aaa; }
        .hardware-sim-tray-bracket.expanded .side-tray-icon { display: none; }

        /* Repositioned Camera Housings */
        .cam-housing {
            background: #0a0a0a;
            border: 2px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 15px;
            left: 15px;
        }
        .m-5 .cam-housing, .m-5c .cam-housing, .m-6 .cam-housing, .m-7 .cam-housing, .m-8 .cam-housing,
        .m-p1 .cam-housing, .m-p3 .cam-housing {
            width: 26px; height: 26px; border-radius: 50%;
        }
        .m-8p .cam-housing {
            width: 44px; height: 24px; border-radius: 12px; gap: 4px; padding: 0 4px;
        }
        .m-x .cam-housing, .m-12 .cam-housing, .m-13 .cam-housing {
            width: 24px; height: 44px; border-radius: 12px; gap: 4px; padding: 4px 0; flex-direction: column;
        }
        .m-11 .cam-housing {
            width: 48px; height: 48px; border-radius: 14px; gap: 4px; padding: 4px; display: grid; grid-template-columns: repeat(2, 1fr); background: rgba(20,20,20,0.8);
        }
        /* Aero horizontal camera vizor architecture */
        .m-p6 .cam-housing, .m-p8 .cam-housing, .m-pFold1 .cam-housing, .m-pFold2 .cam-housing, .m-p10 .cam-housing, .m-p10XL .cam-housing {
            width: 80%; height: 20px; left: 10%; top: 25px; border-radius: 4px; gap: 10px; padding: 0 10px;
        }

        .lens { width: 10px; height: 10px; background: #05101a; border-radius: 50%; border: 1px solid #111; margin: auto; }

        .hardware-info { text-align: center; margin-top: 60px; font-size: 9px; text-transform: uppercase; line-height: 14px; color: inherit; opacity: 0.7; width: 100%; }

        /* Window Overlay Utilitarian Elements */
        .utility-row { display: flex; gap: 4px; margin-bottom: 4px; flex-shrink: 0; }
        .utility-row input { flex-grow: 1; }
        
        /* Floating HUD metrics on devices */
        .spatial-hud {
            position: absolute; bottom: -35px; left: 0; width: 100%;
            text-align: center; font-size: 10px; color: var(--text-muted);
            pointer-events: none; line-height: 14px;
        }

        .flip-tab {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 2px 6px;
            font-size: 8px; border-radius: 3px; color: #aaa; cursor: pointer;
        }
        .flip-tab:hover { color: #fff; background: #000; }

        /* Router Elements Matrix Profiles */
        .router-wrapper {
            position: absolute;
            width: 120px;
            height: 90px;
            background: #181818;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 8px;
            font-size: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.8);
            cursor: move;
            z-index: 4;
        }
        .router-antenna {
            position: absolute; top: -15px; width: 3px; height: 15px; background: #444;
        }
        .router-antenna.a1 { left: 20px; }
        .router-antenna.a2 { right: 20px; }
        .router-led {
            width: 5px; height: 5px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 4px;
        }

        /* Drawing Box Marquee Infrastructure */
        #selection-marquee {
            position: absolute;
            border: 1px dashed #ffcc00;
            background: rgba(255, 204, 0, 0.15);
            pointer-events: none;
            display: none;
            z-index: 1000;
        }

        .selected-group-node {
            box-shadow: 0 0 0 2px #ffcc00 !important;
        }

        /* Monogram Contact circle layout styles */
        .contact-entry {
            display: flex; align-items: center; gap: 8px; padding: 6px; background: #111; margin-bottom: 4px; border: 1px solid #222; border-radius: 4px;
        }
        .contact-monogram {
            width: 24px; height: 24px; border-radius: 50%; background: #444; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; text-transform: uppercase;
        }
    </style>
</head>
<body>

                <div>
                    <label style="font-size:9px; color:var(--text-muted)">HARDWARE FINISH FINALLER:</label>
                    <select id="spawn-color" style="width:100%; margin-top:1px;">
                        <option value="matte-black">Matte Black</option>

        <div class="panel-section" id="sim-factory">
            <h3>SIM Card Factory Allocation</h3>
            <div style="display:flex; flex-direction:column; gap:4px; overflow-y:auto; flex-grow:1;">
                <div style="display:flex; gap:4px;">
                    <input type="text" id="sim-phone-input" placeholder="Digits (e.g. 5550199)" style="width:65%;">
                    <button onclick="Workspace.generateNewSimCard()" style="width:35%;">BUILD SIM</button>
                </div>

                    Simulated operational active switches run matrix parameters seamlessly inside global radio environments. Click device trays to link numbers.
                </div>

        </div>

        <div class="panel-section" id="network-logger">
            <h3>Central Switchboard Diagnostic Log Stream</h3>
            <div class="log-stream" id="log-anchor">
                <div class="log-entry">[SYSTEM] Framework operational initialization complete.</div>
            </div>
        </div>
    </div>

    <div id="workspace-container">
        <div id="workspace-canvas">
            <div id="selection-marquee"></div>
        </div>
    </div>

    <script>
        const UiEngine = {
            handleModelChange() {
                const model = document.getElementById('spawn-model').value;
                const colorSelect = document.getElementById('spawn-color');
                colorSelect.innerHTML = '';
                
                if (model === 'm-5c') {
                    colorSelect.innerHTML = `
                        <option value="neon-blue">Neon Blue</option>
                        <option value="lime-green">Lime Green</option>
                        <option value="coral-pink">Coral Pink</option>
                        <option value="canary-yellow">Canary Yellow</option>
                    `;
                } else if (model === 'm-6') {
                    colorSelect.innerHTML = `
                        <option value="space-gray">Space Gray</option>
                        <option value="silver">Silver</option>
                        <option value="gold">Gold</option>
                    `;
                } else if (model === 'm-11') {
                    colorSelect.innerHTML = `
                        <option value="matte-black">Matte Black</option>
                        <option value="monochrome-white">Monochrome White</option>
                        <option value="purple">Purple</option>
                        <option value="mint-green">Mint Green</option>
                        <option value="product-red">Product RED</option>
                    `;
                } else if (model === 'm-12' || model === 'm-13') {
                    colorSelect.innerHTML = `
                        <option value="pacific-blue">Pacific Blue</option>
                        <option value="slate-graphite">Slate Graphite</option>
                        <option value="sierra-blue">Sierra Blue</option>
                        <option value="alpine-green">Alpine Green</option>
                        <option value="midnight">Midnight Black</option>
                        <option value="starlight">Starlight White</option>
                        <option value="product-red">Product RED</option>
                    `;
                } else if (model.startsWith('m-p')) { // Aero OS Phone color metrics
                    colorSelect.innerHTML = `
                        <option value="quite-black">Quite Black</option>
                        <option value="very-silver">Very Silver</option>
                        <option value="not-pink">Not Pink</option>
                        <option value="clearly-white">Clearly White</option>
                        <option value="stormy-black">Stormy Black</option>
                        <option value="sorta-seafoam">Sorta Seafoam</option>
                        <option value="obsidian">Obsidian</option>
                        <option value="porcelain">Porcelain</option>
                        <option value="bay-blue">Bay Blue</option>
                        <option value="aloe">Aloe Green</option>
                        <option value="hazel">Hazel Gray</option>
                    `;
                } else {
                    colorSelect.innerHTML = `
                        <option value="matte-black">Matte Black</option>
                        <option value="industrial-gray">Industrial Gray</option>
                        <option value="monochrome-white">Monochrome White</option>
                        <option value="rose-gold">Rose Gold</option>
                        <option value="rose">Rose</option>
                    `;
                }
            }
        };

        // Central Core State Database Engine
        const NetworkHub = {
            sims: {},
            socialAccounts: {},
            socialPosts: [],
            socialDMs: {}, // { "@handle": [{sender, text}] }
            shortsFeed: [
                { creator: "@tech_grid", text: "=== AERO OS INFRASTRUCTURE ===\n   .---.\n  /     \\\n  | Aero |\n  \\     /\n   '---'", views: "142K views" },
                { creator: "@matrix_coder", text: "Matrix execution loops active.\n[ Aero OS vs Classic UI ]\nStreaming dynamic vector blocks.", views: "98K views" },
                { creator: "@vector_lord", text: "Pure SVG vector rendering inside.\nNo external imagery payload.\nMinimalist workflow rules.", views: "2.1M views" }
            ],
            activeCalls: {},
            routers: {},
            
            init() {
                this.socialAccounts["@network_ops"] = { handle: "@network_ops", pass: "123" };
                this.socialAccounts["@echo_bot"] = { handle: "@echo_bot", pass: "123" };
                this.socialPosts.push({ sender: "@network_ops", content: "Mainframe infrastructure testing completely operational. Latency routing active." });
                this.socialPosts.push({ sender: "@echo_bot", content: "Hello world. Grid virtualization nodes are linked to the switchboard." });
            },
            log(subsystem, text) {
                const anchor = document.getElementById('log-anchor');
                if(!anchor) return;
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerText = `[${subsystem.toUpperCase()}] ${text}`;
                anchor.appendChild(div);
                anchor.scrollTop = anchor.scrollHeight;
            },
            calculateLatency(phoneIdA, phoneIdB) {
                const devA = Workspace.devices[phoneIdA];
                const devB = Workspace.devices[phoneIdB];
                if(!devA || !devB) return { latency: 10, commonSSID: null };
                if(devA.connectedWifiSSID !== "DISCONNECTED" && devA.connectedWifiSSID === devB.connectedWifiSSID) {
                    return { latency: 15, commonSSID: devA.connectedWifiSSID };
                }
                const dx = devA.x - devB.x;
                const dy = devA.y - devB.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                const latency = Math.round(50 + (distance * 0.15));
                return { latency, commonSSID: null };
            },
            routeSMS(fromNum, toNum, text, originatingPhoneId) {
                const targetSim = this.sims[toNum];
                if(!targetSim || !targetSim.allocatedTo) {
                    this.log("SMS Core", `Delivery failure: text to +1 (${toNum}) dropped. Target unallocated.`);
                    return false;
                }
                const destPhoneId = targetSim.allocatedTo;
                const metrics = this.calculateLatency(originatingPhoneId, destPhoneId);
                
                this.log("SMS Core", `Routing SMS payload [${fromNum} -> ${toNum}] via grid. Delay: ${metrics.latency}ms`);
                
                if(!targetSim.messages[fromNum]) {
                    targetSim.messages[fromNum] = [];
                }
                targetSim.messages[fromNum].push({ direction: 'rcvd', text: text, fromAero: Workspace.devices[originatingPhoneId]?.isAero || false });
                
                setTimeout(() => {
                    const targetDevice = Workspace.devices[destPhoneId];
                    if(targetDevice) {
                        targetDevice.receiveSMS(fromNum, text, Workspace.devices[originatingPhoneId]?.isAero || false);
                    }
                }, metrics.latency);
                return true;
            },
            initiateCall(fromNum, toNum, originatingPhoneId) {
                const targetSim = this.sims[toNum];
                if(!targetSim || !targetSim.allocatedTo) {
                    this.log("Switchboard", `Call Failed: +1 (${toNum}) is out of service area.`);
                    return "FAILED";
                }
                const targetPhoneId = targetSim.allocatedTo;
                if(targetPhoneId === originatingPhoneId) return "BUSY";
                const metrics = this.calculateLatency(originatingPhoneId, targetPhoneId);
                this.log("Switchboard", `Establishing Call Path [${fromNum} -> ${toNum}] | Pipeline Delay: ${metrics.latency}ms`);
                setTimeout(() => {
                    const targetDevice = Workspace.devices[targetPhoneId];
                    if(targetDevice) {
                        targetDevice.triggerIncomingCall(fromNum, originatingPhoneId);
                    }
                }, metrics.latency);
                return "ROUTING";
            },
            connectCall(phoneIdA, phoneIdB) {
                this.activeCalls[phoneIdA] = phoneIdB;
                this.activeCalls[phoneIdB] = phoneIdA;
                this.log("Switchboard", `Circuit Connection Locked: Device ID #${phoneIdA} <=> Device ID #${phoneIdB}`);
                if(Workspace.devices[phoneIdA]) Workspace.devices[phoneIdA].establishCallConnection();
                if(Workspace.devices[phoneIdB]) Workspace.devices[phoneIdB].establishCallConnection();
            },
            terminateCall(phoneId) {
                const peerId = this.activeCalls[phoneId];
                delete this.activeCalls[phoneId];
                if(peerId) {
                    delete this.activeCalls[peerId];
                    const peerDevice = Workspace.devices[peerId];
                    if(peerDevice) peerDevice.hangupCall(false);
                }
            },
            publishSocialPost(sender, content, originatingPhoneId) {
                this.socialPosts.unshift({ sender, content });
                Object.values(Workspace.devices).forEach(dev => {
                    const metrics = this.calculateLatency(originatingPhoneId, dev.id);
                    setTimeout(() => {
                        dev.refreshSocialFeed();
                    }, metrics.latency);
                });
                this.log("NetSpace DB", `${sender} blasted global timeline: "${content}"`);
            },
            sendSocialDM(sender, recipient, text, originatingPhoneId) {
                if(!this.socialDMs[recipient]) this.socialDMs[recipient] = [];
                if(!this.socialDMs[sender]) this.socialDMs[sender] = [];
                
                const payload = { sender, text };
                this.socialDMs[recipient].push(payload);
                this.socialDMs[sender].push(payload);
                
                Object.values(Workspace.devices).forEach(dev => {
                    if(dev.activeSocialUser === recipient || dev.activeSocialUser === sender) {
                        const metrics = this.calculateLatency(originatingPhoneId, dev.id);
                        setTimeout(() => { dev.refreshSocialDMs(); }, metrics.latency);
                    }
                });
            }
        };

        // Infinite Canvas Workspace Manager
        const Workspace = {
            devices: {},
            routers: {},
            deviceIncrementalId: 1,
            routerIncrementalId: 1,
            zoom: 1.0,
            panX: 100,
            panY: 50,
            isPanning: false,
            startX: 0,
            startY: 0,
            canvas: null,
            selectedNodes: [],
            isDrawingArea: false,
            marquee: null,
            marqueeStartX: 0,
            marqueeStartY: 0,

            init() {
                const container = document.getElementById('workspace-container');
                this.canvas = document.getElementById('workspace-canvas');
                this.marquee = document.getElementById('selection-marquee');

                container.addEventListener('mousedown', (e) => {
                    if(e.target !== container && e.target !== this.canvas) return;
                    if(e.shiftKey) {
                        this.isDrawingArea = true;
                        const rect = this.canvas.getBoundingClientRect();
                        this.marqueeStartX = (e.clientX - rect.left) / this.zoom;
                        this.marqueeStartY = (e.clientY - rect.top) / this.zoom;
                        this.marquee.style.left = `${this.marqueeStartX}px`;
                        this.marquee.style.top = `${this.marqueeStartY}px`;
                        this.marquee.style.width = '0px';
                        this.marquee.style.height = '0px';
                        this.marquee.style.display = 'block';
                        this.clearSelection();
                    } else {
                        this.isPanning = true;
                        container.style.cursor = 'grabbing';
                        this.startX = e.clientX - this.panX;
                        this.startY = e.clientY - this.panY;
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if(this.isPanning) {
                        this.panX = e.clientX - this.startX;
                        this.panY = e.clientY - this.startY;
                        this.updateTransform();
                    } else if (this.isDrawingArea) {
                        const rect = this.canvas.getBoundingClientRect();
                        const currentX = (e.clientX - rect.left) / this.zoom;
                        const currentY = (e.clientY - rect.top) / this.zoom;
                        
                        const left = Math.min(this.marqueeStartX, currentX);
                        const top = Math.min(this.marqueeStartY, currentY);
                        const width = Math.abs(this.marqueeStartX - currentX);
                        const height = Math.abs(this.marqueeStartY - currentY);
                        
                        this.marquee.style.left = `${left}px`;
                        this.marquee.style.top = `${top}px`;
                        this.marquee.style.width = `${width}px`;
                        this.marquee.style.height = `${height}px`;
                    }
                });

                window.addEventListener('mouseup', () => {
                    if(this.isPanning) {
                        this.isPanning = false;
                        container.style.cursor = 'grab';
                    } else if(this.isDrawingArea) {
                        this.isDrawingArea = false;
                        this.marquee.style.display = 'none';
                        this.evaluateMarqueeSelection();
                    }
                });

                this.updateTransform();
                
                // Spawn initial workspace environments
                this.spawnDevice(80, 60, "m-6", "space-gray");
                this.spawnDevice(370, 60, "m-x", "matte-black");
                this.spawnDevice(680, 60, "m-p8", "obsidian"); // Spawn an Android OS instance default
                this.spawnRouter(400, 420, "Default_Gateway_5G");
            },
            updateTransform() {
                this.canvas.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoom})`;
            },
            generateNewSimCard() {
                const input = document.getElementById('sim-phone-input');
                const rawNum = input.value.trim();
                if(!rawNum || NetworkHub.sims[rawNum]) {
                    alert("Invalid digits or cell loop collision.");
                    return;
                }
                NetworkHub.sims[rawNum] = {
                    phoneNumber: rawNum,
                    allocatedTo: null,
                    messages: {}
                };
                NetworkHub.log("Factory", `Forged new active card pipeline: +1 (${rawNum})`);
                Object.values(this.devices).forEach(dev => dev.refreshHardwareTrayMenu());
                input.value = '';
            },
            triggerDeviceSpawn() {
                const model = document.getElementById('spawn-model').value;
                const color = document.getElementById('spawn-color').value;
                const rx = 100 + Math.random() * 400;
                const ry = 100 + Math.random() * 250;
                this.spawnDevice(rx, ry, model, color);
            },
            triggerRouterSpawn() {
                const rx = 150 + Math.random() * 450;
                const ry = 150 + Math.random() * 250;
                const ssid = `TRANSCEIVER_SSID_${Math.floor(100 + Math.random()*900)}`;
                this.spawnRouter(rx, ry, ssid);
            },
            spawnDevice(x, y, model, color) {
                const id = this.deviceIncrementalId++;
                const dev = new PhoneInstance(id, x, y, model, color);
                this.devices[id] = dev;
                dev.renderToCanvas(this.canvas);
                NetworkHub.log("Workspace", `Assembled Device Context Node ID #${id} [${model}:${color}]`);
                Object.values(this.devices).forEach(d => d.populateWifiDropdownOptions());
            },
            spawnRouter(x, y, ssid) {
                const id = this.routerIncrementalId++;
                const rt = new RouterInstance(id, x, y, ssid);
                this.routers[id] = rt;
                rt.renderToCanvas(this.canvas);
                NetworkHub.log("Workspace", `Deployed Wi-Fi Base Transceiver ID #${id} SSID: ${ssid}`);
                Object.values(this.devices).forEach(d => d.populateWifiDropdownOptions());
            },
            clearSelection() {
                this.selectedNodes.forEach(node => {
                    if(node.domElement) node.domElement.classList.remove('selected-group-node');
                });
                this.selectedNodes = [];
            },
            evaluateMarqueeSelection() {
                const mRect = this.marquee.getBoundingClientRect();
                if(mRect.width < 5 || mRect.height < 5) return;
                this.selectedNodes = [];
                Object.values(this.devices).forEach(dev => {
                    const dRect = dev.domElement.getBoundingClientRect();
                    if (dRect.left >= mRect.left && dRect.right <= mRect.right && dRect.top >= mRect.top && dRect.bottom <= mRect.bottom) {
                        this.selectedNodes.push(dev);
                        dev.domElement.classList.add('selected-group-node');
                    }
                });
                Object.values(this.routers).forEach(rt => {
                    const rRect = rt.domElement.getBoundingClientRect();
                    if (rRect.left >= mRect.left && rRect.right <= mRect.right && rRect.top >= mRect.top && rRect.bottom <= mRect.bottom) {
                        this.selectedNodes.push(rt);
                        rt.domElement.classList.add('selected-group-node');
                    }
                });
            }
        };

        // Wireless Router Blueprint
        class RouterInstance {
            constructor(id, x, y, ssid) {
                this.id = id; this.x = x; this.y = y; this.ssid = ssid;
                this.domElement = null;
            }
            renderToCanvas(canvasContainer) {
                const wrapper = document.createElement('div');
                wrapper.className = 'router-wrapper';
                wrapper.style.left = `${this.x}px`;
                wrapper.style.top = `${this.y}px`;
                this.domElement = wrapper;
                this.updateDOMContent();
                canvasContainer.appendChild(wrapper);
                this.bindEvents();
            }
            updateDOMContent() {
                this.domElement.innerHTML = `
                    <div class="router-antenna a1"></div>
                    <div class="router-antenna a2"></div>
                    <div style="font-weight:bold; color:#fff; margin-bottom:4px; font-size:11px;">📡 WI-FI ROUTER</div>
                    <div style="color:var(--text-muted); font-size:9px; margin-bottom:4px;">SSID: <span style="color:#ffcc00">${this.ssid}</span></div>
                    <div><span class="router-led"></span><span style="font-size:9px;">AP MODE ACTIVE</span></div>
                `;
            }
            bindEvents() {
                let dragStart = {x:0, y:0};
                const onMouseDown = (e) => {
                    if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
                    e.stopPropagation();
                    dragStart.x = e.clientX; dragStart.y = e.clientY;
                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                };
                const onMouseMove = (e) => {
                    const dx = (e.clientX - dragStart.x) / Workspace.zoom;
                    const dy = (e.clientY - dragStart.y) / Workspace.zoom;
                    dragStart.x = e.clientX; dragStart.y = e.clientY;
                    if (Workspace.selectedNodes.includes(this)) {
                        Workspace.selectedNodes.forEach(node => {
                            node.x += dx; node.y += dy;
                            node.domElement.style.left = `${node.x}px`;
                            node.domElement.style.top = `${node.y}px`;
                        });
                    } else {
                        this.x += dx; this.y += dy;
                        this.domElement.style.left = `${this.x}px`;
                        this.domElement.style.top = `${this.y}px`;
                    }
                };
                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };
                this.domElement.addEventListener('mousedown', onMouseDown);
            }
        }
