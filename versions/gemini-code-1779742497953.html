                `;
            }

            getBezelHexColor() {
                const colors = {
                    'matte-black': '#141414',
                    'industrial-gray': '#2e2e2e',
                    'monochrome-white': '#dcdcdc',
                    'rose-gold': '#fad6d6',
                    'rose': '#ffb6c1',
                    'neon-blue': '#00a3e0',
                    'lime-green': '#4cd964',
                    'coral-pink': '#ff4f6a',
                    'canary-yellow': '#ffcc00'
                };
                return colors[this.color] || '#333333';
            }

            updateCoordsHud() {
                this.domElement.querySelector('.hud-coords').innerText = `(${Math.round(this.x)}, ${Math.round(this.y)})`;
                const cBox = this.domElement.querySelector('.settings-coords');
                if(cBox) cBox.innerText = `X: ${Math.round(this.x)}, Y: ${Math.round(this.y)}`;
            }

            renderLauncherGrid() {
                const grid = this.domElement.querySelector('.launcher-grid');
                grid.innerHTML = '';
                
                const meta = {
                    phone: { icon: '📞', title: 'Phone' },
                    messages: { icon: '💬', title: 'Messages' },
                    netspace: { icon: '🌐', title: 'NetSpace' },
                    settings: { icon: '⚙️', title: 'Settings' },
                    store: { icon: '🛒', title: 'Store' },
                    chat: { icon: '💬', title: 'NetChat' },
                    game: { icon: '🎮', title: 'BlockCraft' }
                };

                this.installedApps.forEach(app => {
                    if (meta[app]) {
                        const item = document.createElement('div');
                        item.className = 'app-icon';
                        item.dataset.launch = app;
                        item.innerHTML = `<span>${meta[app].icon}</span>${meta[app].title}`;
                        item.addEventListener('click', () => this.switchApp(app));
                        grid.appendChild(item);
                    }
                });
            }

            renderCallRecents() {
                const list = this.domElement.querySelector('.recents-list');
                list.innerHTML = '';
                if(this.callRecents.length === 0) {
                    list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">No Recent Calls</div>';
                    return;
                }
                this.callRecents.forEach(call => {
                    const el = document.createElement('div');
                    el.style.padding = '6px';
                    el.style.borderBottom = '1px solid #1a1a1a';
                    el.style.fontSize = '11px';
                    el.style.display = 'flex';
                    el.style.justifyContent = 'space-between';
                    const nameLabel = this.resolveName(call.number);
                    el.innerHTML = `<span>${call.type === 'incoming' ? '📥' : '📤'} <strong>${nameLabel}</strong></span><span style="color:var(--text-muted)">${call.timestamp}</span>`;
                    list.appendChild(el);
                });
            }

            renderContacts() {
                const list = this.domElement.querySelector('.contacts-list');
                list.innerHTML = '';
                const keys = Object.keys(this.contacts);
                if(keys.length === 0) {
                    list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">No Contacts Presets</div>';
                    return;
                }
                keys.forEach(num => {
                    const el = document.createElement('div');
                    el.style.padding = '6px';
                    el.style.borderBottom = '1px solid #1a1a1a';
                    el.style.fontSize = '11px';
                    el.style.display = 'flex';
                    el.style.justifyContent = 'space-between';
                    el.innerHTML = `<span>👤 <strong>${this.contacts[num]}</strong></span><span style="color:var(--text-muted)">+1 (${num})</span>`;
                    list.appendChild(el);
                });
            }

            bindHardwareEvents() {
                // Interactive bracket sim tray click shortcut -> Flips to back frame
                this.domElement.querySelector('.hardware-sim-tray-bracket').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.domElement.classList.toggle('flipped');
                });

                this.domElement.querySelector('.flip-tab').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.domElement.classList.toggle('flipped');
                });

                // Hardware Structural Drag and Move System Linkages with Multi-select coordinates translation bounds
                let dragStart = {x:0, y:0};
                const onMouseDown = (e) => {
                    if(e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.className === 'flip-tab' || e.target.className === 'hardware-sim-tray-bracket') return;
                    e.stopPropagation();
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;
                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                };

                const onMouseMove = (e) => {
                    const dx = (e.clientX - dragStart.x) / Workspace.zoom;
                    const dy = (e.clientY - dragStart.y) / Workspace.zoom;
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;

                    if (Workspace.selectedNodes.includes(this)) {
                        Workspace.selectedNodes.forEach(node => {
                            node.x += dx;
                            node.y += dy;
                            node.domElement.style.left = `${node.x}px`;
                            node.domElement.style.top = `${node.y}px`;
                            node.updateCoordsHud();
                        });
                    } else {
                        this.x += dx;
                        this.y += dy;
                        this.domElement.style.left = `${this.x}px`;
                        this.domElement.style.top = `${this.y}px`;
                        this.updateCoordsHud();
                    }
                };

                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };

                this.domElement.addEventListener('mousedown', onMouseDown);

                // OS Interface Controls Linkages
                this.domElement.querySelector('.home-button').addEventListener('click', () => this.switchApp('launcher'));
                this.domElement.querySelector('.home-bar').addEventListener('click', () => this.switchApp('launcher'));

                this.domElement.querySelectorAll('.app-close').forEach(btn => {
                    btn.addEventListener('click', () => this.switchApp('launcher'));
                });

                // Phone Tab System
                this.domElement.querySelectorAll('.phone-tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.domElement.querySelectorAll('.phone-tab-btn').forEach(b => b.style.background = '#0c0c0c');
                        btn.style.background = '#1a1a1a';
                        const targetTab = btn.dataset.tab;
                        this.domElement.querySelectorAll('.phone-tab-content').forEach(c => {
                            c.style.display = c.dataset.tabContent === targetTab ? 'flex' : 'none';
                        });
                        if(targetTab === 'recents') this.renderCallRecents();
                        if(targetTab === 'contacts') this.renderContacts();
                    });
                });

                // Contacts Subsystem Event
                this.domElement.querySelector('.contact-add-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const numIn = this.domElement.querySelector('.contact-num');
                    const nameIn = this.domElement.querySelector('.contact-name');
                    if(numIn.value.trim() && nameIn.value.trim()) {
                        this.contacts[numIn.value.trim()] = nameIn.value.trim();
                        numIn.value = '';
                        nameIn.value = '';
                        this.renderContacts();
                    }
                });

                // App Store Get Buttons
                this.domElement.querySelectorAll('.install-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const appName = btn.dataset.inst;
                        if (!this.installedApps.includes(appName)) {
                            this.installedApps.push(appName);
                            this.renderLauncherGrid();
                            btn.innerText = "INSTALLED";
                            btn.disabled = true;
                            NetworkHub.log("App Store", `Installed ${appName.toUpperCase()} securely on Node #${this.id}`);
                        }
                    });
                });

                // NetChat Message Send Engine Trigger
                this.domElement.querySelector('.netchat-send-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.sendNetChatMessage();
                });

                // Multiplayer Mobile Game Control Linkage Array
                this.domElement.querySelectorAll('.game-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if(!NetworkHub.gamePlayers || !NetworkHub.gamePlayers[this.id]) return;
                        const dir = btn.dataset.dir;
                        const p = NetworkHub.gamePlayers[this.id];
                        if(dir === 'up') p.y = Math.max(0, p.y - 12);
                        if(dir === 'down') p.y = Math.min(100, p.y + 12);
                        if(dir === 'left') p.x = Math.max(0, p.x - 12);
                        if(dir === 'right') p.x = Math.min(220, p.x + 12);
                        this.renderGameArena();
                    });
                });

                // Physical SIM Card Insertion Interface Controller Routine
                const simSelector = this.domElement.querySelector('.sim-selector-node');
                this.domElement.querySelector('.sim-tray-slot-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const chosen = simSelector.value;
                    
                    if(this.currentSim) {
                        NetworkHub.sims[this.currentSim].allocatedTo = null;
                        NetworkHub.log("Carrier", `SIM Matrix +1 (${this.currentSim}) removed from Frame Node ID #${this.id}`);
                    }
                    
                    if(chosen === "NONE") {
                        this.currentSim = null;
                    } else {
                        if(NetworkHub.sims[chosen].allocatedTo) {
                            const oldPhone = Workspace.devices[NetworkHub.sims[chosen].allocatedTo];
                            if(oldPhone) {
                                oldPhone.currentSim = null; 
                                oldPhone.updateStatusBar();
                            }
                        }
                        this.currentSim = chosen;
                        NetworkHub.sims[chosen].allocatedTo = this.id;
                        NetworkHub.log("Carrier", `SIM Transponder Activated: +1 (${chosen}) latched onto hardware instance ID #${this.id}`);
                    }
                    this.updateStatusBar();
                    Workspace.refreshAllSimTrays();
                });

                // Dialer System Events
                const dialOutput = this.domElement.querySelector('.dialer-output');
                this.domElement.querySelectorAll('.dial-btn').forEach(btn => {
                    btn.addEventListener('click', () => dialOutput.innerText += btn.innerText);
                });
                this.domElement.querySelector('.phone-clear-trigger').addEventListener('click', () => dialOutput.innerText = '');
                
                this.domElement.querySelector('.phone-call-trigger').addEventListener('click', () => {
                    const target = dialOutput.innerText.trim();
                    if(!this.currentSim) { alert("NO CELLULAR TRANSPONDER LINK ENCRYPTED (INSERT SIM)"); return; }
                    if(!target) return;
                    
                    this.domElement.querySelector('.phone-call-trigger').style.display = 'none';
                    this.domElement.querySelector('.dialer-pad').style.display = 'none';
                    const stateBox = this.domElement.querySelector('.active-call-state');
                    stateBox.style.display = 'block';
                    stateBox.querySelector('.call-status-label').innerText = "ROUTING CORRIDOR...";
                    
                    const res = NetworkHub.initiateCall(this.currentSim, target, this.id);
                    if(res === "FAILED") {
                        stateBox.querySelector('.call-status-label').innerText = "LINE UNREACHABLE";
                    } else if(res === "BUSY") {
                        stateBox.querySelector('.call-status-label').innerText = "CIRCUIT BUSY LOOP";
                    } else {
                        this.activeCallData = { role: 'caller', targetNumber: target };
                    }
                });

                this.domElement.querySelector('.phone-hangup-trigger').addEventListener('click', () => this.hangupCall(true));

                // Incoming Call Handlers
                this.domElement.querySelector('.accept-btn').addEventListener('click', () => {
                    this.domElement.querySelector('.inc-call-overlay').classList.remove('active');
                    this.switchApp('phone');
                    this.domElement.querySelector('.phone-call-trigger').style.display = 'none';
                    this.domElement.querySelector('.dialer-pad').style.display = 'none';
                    const stateBox = this.domElement.querySelector('.active-call-state');
                    stateBox.style.display = 'block';
                    
                    NetworkHub.connectCall(this.id, this.activeCallData.peerPhoneId);
                });

                this.domElement.querySelector('.decline-btn').addEventListener('click', () => {
                    this.domElement.querySelector('.inc-call-overlay').classList.remove('active');
                    NetworkHub.terminateCall(this.id);
                    this.activeCallData = null;
                });

                // SMS Messaging Linkages
                this.domElement.querySelector('.msg-open-thread').addEventListener('click', () => {
                    const input = this.domElement.querySelector('.msg-target-input');
                    const num = input.value.trim();
                    if(!num) return;
                    this.openChatThread(num);
                });

                this.domElement.querySelector('.msg-back-to-threads').addEventListener('click', () => {
                    this.domElement.querySelector('.msg-active-chat').style.display = 'none';
                    this.domElement.querySelector('.msg-thread-selector').style.display = 'flex';
                    this.renderMessageThreadsList();
                });

                this.domElement.querySelector('.chat-send-trigger').addEventListener('click', () => {
                    const inp = this.domElement.querySelector('.chat-msg-input');
                    const msg = inp.value.trim();
                    if(!msg || !this.currentSim) return;
                    
                    const activeTargetNum = this.activeChatNum;
                    this.saveLocalSMS(this.currentSim, activeTargetNum, 'sent', msg);
                    NetworkHub.routeSMS(this.currentSim, activeTargetNum, msg, this.id);
                    
                    inp.value = '';
                    this.openChatThread(activeTargetNum); 
                });

                // Netspace Social Interactions Login logic
                this.domElement.querySelector('.soc-login-trigger').addEventListener('click', () => {
                    const input = this.domElement.querySelector('.soc-user-input');
                    let handle = input.value.trim();
                    if(!handle.startsWith('@')) handle = '@' + handle;
                    if(handle.length < 2) return;

                    if(!NetworkHub.socialAccounts[handle]) {
                        NetworkHub.socialAccounts[handle] = { handle: handle };
                    }
                    if(!this.socialAccountsCache.includes(handle)) {
                        if(this.socialAccountsCache.length >= 5) this.socialAccountsCache.shift();
                        this.socialAccountsCache.push(handle);
                    }
                    this.activeSocialUser = handle;
                    input.value = '';
                    this.renderSocialAppView();
                });

                this.domElement.querySelector('.soc-post-trigger').addEventListener('click', () => {
                    const input = this.domElement.querySelector('.soc-post-input');
                    const txt = input.value.trim();
                    if(!txt || !this.activeSocialUser) return;
                    NetworkHub.publishSocialPost(this.activeSocialUser, txt, this.id);
                    input.value = '';
                });

                // Settings App Sub-controls: WiFi and Wallpaper selection engine
                const wifiSelect = this.domElement.querySelector('.settings-wifi-selector');
                wifiSelect.addEventListener('change', () => {
                    this.connectedWifiSSID = wifiSelect.value;
                    this.updateStatusBar();
                    NetworkHub.log("Hardware OS", `Device ID #${this.id} linked network interface matrix to WiFi [SSID: ${this.connectedWifiSSID}]`);
                    this.syncNetworkAppsState();
                });

                const wpSelect = this.domElement.querySelector('.settings-wallpaper-selector');
                wpSelect.addEventListener('change', () => {
                    this.currentWallpaper = wpSelect.value;
                    this.applyWallpaperGraphicStyle();
                });

                // Volatile Storage Wipes Trigger Component Routine
                this.domElement.querySelector('.wipe-device-data').addEventListener('click', () => {
                    this.socialAccountsCache = [];
                    this.activeSocialUser = null;
                    this.connectedWifiSSID = "DISCONNECTED";
                    this.currentWallpaper = "none";
                    this.contacts = {};
                    this.callRecents = [];
                    this.unreadNotifications = false;
                    this.installedApps = ['phone', 'messages', 'netspace', 'settings', 'store'];
                    this.applyWallpaperGraphicStyle();
                    if(this.currentSim) {
                        NetworkHub.sims[this.currentSim].allocatedTo = null;
                        this.currentSim = null;
                    }
                    this.updateStatusBar();
                    this.renderLauncherGrid();
                    this.switchApp('launcher');
                    NetworkHub.log("Hardware OS", `Hardware Frame ID Node #${this.id} successfully wiped physical system storage registers.`);
                });
            }

            applyWallpaperGraphicStyle() {
                const vp = this.domElement.querySelector(`#screen-viewport-${this.id}`);
                if(!vp) return;
                
                const wallpaperSVGs = {
                    matrix: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23050a05'/><text x='10' y='30' fill='%2300ff00' font-family='monospace' font-size='10' opacity='0.3'>010101</text><text x='40' y='70' fill='%2300ff00' font-family='monospace' font-size='10' opacity='0.2'>101010</text></svg>`,
                    industrial: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%231e222b'/><line x1='0' y1='0' x2='100' y2='100' stroke='%232a303d' stroke-width='2'/><circle cx='50' cy='50' r='15' fill='none' stroke='%233a4050' stroke-width='1'/></svg>`,
                    neon: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0%27 stop-color='%2320003b'/><stop offset='100%27 stop-color='%23050010'/></linearGradient><rect width='100' height='100' fill='url(%23g)'/><circle cx='50' cy='90' r='30' fill='%23ff007f' opacity='0.3'/><line x1='0' y1='90' x2='100' y2='90' stroke='%2300fff0' stroke-width='1.5'/></svg>`,
                    m5_exclusive: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%232c3e50'/><path d='M0,0 L50,0 L100,100 L50,100 Z' fill='%2334495e' opacity='0.5'/></svg>`,
                    m78_exclusive: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%231a1a1a'/><path d='M0,50 Q25,20 50,50 T100,50' fill='none' stroke='%23555555' stroke-width='2'/></svg>`,
                    mx_exclusive: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%230a0a0a'/><circle cx='50' cy='0' r='45' fill='none' stroke='%238a2be2' stroke-width='2' opacity='0.6'/></svg>`
                };

                if (wallpaperSVGs[this.currentWallpaper]) {
                    vp.style.backgroundImage = `url("${wallpaperSVGs[this.currentWallpaper]}")`;
                } else {
                    vp.style.backgroundImage = "none";
                    vp.style.backgroundColor = "#000000";
                }
                NetworkHub.log("Hardware UI", `Applied wallpaper '${this.currentWallpaper}' to viewport screen container on Node #${this.id}`);
            }

            syncNetworkAppsState() {
                const isOnline = this.connectedWifiSSID !== "DISCONNECTED";
                
                // NetChat state sync
                this.domElement.querySelector('.chat-offline').style.display = isOnline ? 'none' : 'flex';
                this.domElement.querySelector('.chat-online').style.display = isOnline ? 'flex' : 'none';
                if(isOnline && this.activeApp === 'chat') this.renderNetChatStream();

                // Game state sync
                this.domElement.querySelector('.game-offline').style.display = isOnline ? 'none' : 'flex';
                this.domElement.querySelector('.game-online').style.display = isOnline ? 'flex' : 'none';
                
                if(isOnline) {
                    if(!NetworkHub.gamePlayers[this.id]) {
                        NetworkHub.gamePlayers[this.id] = { x: 50, y: 50, color: this.getBezelHexColor(), model: this.model };
                    }
                    if(this.activeApp === 'game') this.initGameLoop();
                } else {
                    clearInterval(this.gameInterval);
                    delete NetworkHub.gamePlayers[this.id];
                }
            }

            initGameLoop() {
                clearInterval(this.gameInterval);
                this.renderGameArena();
                this.gameInterval = setInterval(() => this.renderGameArena(), 400);
            }

            renderGameArena() {
                const arena = this.domElement.querySelector('.game-arena');
                if(!arena) return;
                arena.innerHTML = '';
                Object.keys(NetworkHub.gamePlayers).forEach(pId => {
                    const p = NetworkHub.gamePlayers[pId];
                    const node = document.createElement('div');
                    node.style.position = 'absolute';
                    node.style.width = '10px';
                    node.style.height = '10px';
                    node.style.background = p.color;
                    node.style.left = `${p.x}px`;
                    node.style.top = `${p.y}px`;
                    node.style.border = '1px solid #fff';
                    node.style.borderRadius = '2px';
                    node.title = `NODE-${pId}`;
                    arena.appendChild(node);
                });
            }

            sendNetChatMessage() {
                const targetInput = this.domElement.querySelector('.netchat-target');
                const contentInput = this.domElement.querySelector('.netchat-input');
                const toNum = targetInput.value.trim();
                const text = contentInput.value.trim();
                if(!toNum || !text || !this.currentSim) return;

                NetworkHub.netChatStore.push({ from: this.currentSim, to: toNum, text: text });
                NetworkHub.routeNetChat(this.currentSim, toNum, text);
                contentInput.value = '';
                this.renderNetChatStream();
            }

            receiveNetChat(fromNum, text) {
                if (this.activeApp === 'chat' && this.domElement.querySelector('.netchat-target').value.trim() === fromNum) {
                    this.renderNetChatStream();
                } else {
                    this.unreadNotifications = true;
                    this.updateStatusBar();
                }
            }

            renderNetChatStream() {
                const stream = this.domElement.querySelector('.netchat-stream');
                if(!stream) return;
                stream.innerHTML = '';
                const activeTarget = this.domElement.querySelector('.netchat-target').value.trim();
                
                NetworkHub.netChatStore.forEach(msg => {
                    if((msg.from === this.currentSim && msg.to === activeTarget) || (msg.to === this.currentSim && msg.from === activeTarget)) {
                        const bub = document.createElement('div');
                        bub.className = `chat-bubble ${msg.from === this.currentSim ? 'sent' : 'rcvd'}`;
                        bub.innerText = msg.text;
                        stream.appendChild(bub);
                    }
                });
                stream.scrollTop = stream.scrollHeight;
            }

            populateWifiDropdownOptions() {
                const select = this.domElement.querySelector('.settings-wifi-selector');
                if(!select) return;
                select.innerHTML = '<option value="DISCONNECTED">[ AIRPLANE MODE / DISCONNECTED ]</option>';
                
                Object.values(Workspace.routers).forEach(rot => {
                    const opt = document.createElement('option');
                    opt.value = rot.ssid;
                    opt.innerText = `Wi-Fi AP: ${rot.ssid}`;
                    select.appendChild(opt);
                });
                select.value = this.connectedWifiSSID;
            }

            switchApp(appName) {
                this.activeApp = appName;
                this.domElement.querySelectorAll('.app-view').forEach(view => {
                    view.classList.remove('active');
                    if(view.dataset.app === appName) view.classList.add('active');
                });

                if(appName === 'launcher') {
                    this.unreadNotifications = false;
                    this.updateStatusBar();
                    clearInterval(this.gameInterval);
                } else if(appName === 'messages') {
                    this.unreadNotifications = false;
                    this.updateStatusBar();
                    this.renderMessageThreadsList();
                    clearInterval(this.gameInterval);
                } else if(appName === 'chat') {
                    this.unreadNotifications = false;
                    this.updateStatusBar();
                    this.syncNetworkAppsState();
                } else if(appName === 'game') {
                    this.syncNetworkAppsState();
                } else if(appName === 'netspace') {
                    this.renderSocialAppView();
                    clearInterval(this.gameInterval);
                } else if(appName === 'settings') {
                    this.populateWifiDropdownOptions();
                    this.domElement.querySelector('.settings-wallpaper-selector').value = this.currentWallpaper;
                    clearInterval(this.gameInterval);
                } else if(appName === 'store') {
                    clearInterval(this.gameInterval);
                    this.domElement.querySelectorAll('.install-btn').forEach(btn => {
                        if(this.installedApps.includes(btn.dataset.inst)) {
                            btn.innerText = "INSTALLED";
                            btn.disabled = true;
                        } else {
                            btn.innerText = "GET";
                            btn.disabled = false;
                        }
                    });
                } else {
                    clearInterval(this.gameInterval);
                }
            }

            updateStatusBar() {
                const carrier = this.domElement.querySelector('.carrier-tag');
                const bars = this.domElement.querySelector('.signal-bars');
                const wifiTag = this.domElement.querySelector('.wifi-indicator-tag');
                const bubble = this.domElement.querySelector('.notification-bubble');
                
                bubble.style.display = this.unreadNotifications ? 'inline-block' : 'none';

                if(this.currentSim) {
                    carrier.innerText = `+1 (${this.currentSim})`;
                    bars.innerText = "▰▰▰▰";
                    bars.style.color = "#00ff00";
                } else {
                    carrier.innerText = "NO CELL LINK";
                    bars.innerText = "▱▱▱▱";
                    bars.style.color = "inherit";
                }

                if(this.connectedWifiSSID !== "DISCONNECTED") {
                    wifiTag.innerText = "📶";
                    wifiTag.style.color = "#00ffff";
                } else {
                    wifiTag.innerText = "📶 OFF";
                    wifiTag.style.color = "inherit";
                }
            }

            clockTick() {
                const now = new Date();
                const hrs = now.getHours().toString().padStart(2, '0');
                const mins = now.getMinutes().toString().padStart(2, '0');
                const element = this.domElement.querySelector('.sim-time');
                if(element) element.innerText = `${hrs}:${mins}`;
            }

            populateSimSelector() {
                const select = this.domElement.querySelector('.sim-selector-node');
                select.innerHTML = '<option value="NONE">[ NO CARD IN TRAY ]</option>';
                Object.keys(NetworkHub.sims).forEach(num => {
                    const sim = NetworkHub.sims[num];
                    if(!sim.allocatedTo || sim.allocatedTo === this.id) {
                        const opt = document.createElement('option');
                        opt.value = num;
                        opt.innerText = `SIM +1 (${num}) ${sim.allocatedTo === this.id ? '[Inserted]' : ''}`;
                        select.appendChild(opt);
                    }
                });
                if(this.currentSim) select.value = this.currentSim;
            }

            triggerIncomingCall(fromNum, peerPhoneId) {
                this.activeCallData = { role: 'receiver', targetNumber: fromNum, peerPhoneId: peerPhoneId };
                const overlay = this.domElement.querySelector('.inc-call-overlay');
                const resolvedLabel = this.resolveName(fromNum);
                overlay.querySelector('.inc-caller-id').innerText = resolvedLabel === fromNum ? `+1 (${fromNum})` : resolvedLabel;
                overlay.classList.add('active');
            }

            establishCallConnection() {
                const stateBox = this.domElement.querySelector('.active-call-state');
                stateBox.querySelector('.call-status-label').innerText = "LIVE LINK ENCRYPTED";
                this.startCallTimer();
            }

            startCallTimer() {
                let sec = 0;
                const display = this.domElement.querySelector('.call-timer');
                display.innerText = "00:00";
                clearInterval(this.callTimerInterval);
                this.callTimerInterval = setInterval(() => {
                    sec++;
                    const m = Math.floor(sec/60).toString().padStart(2, '0');
                    const s = (sec%60).toString().padStart(2, '0');
                    display.innerText = `${m}:${s}`;
                }, 1000);
            }

            hangupCall(notifyNetwork = true) {
                clearInterval(this.callTimerInterval);
                if(notifyNetwork) {
                    NetworkHub.terminateCall(this.id);
                }
                
                this.domElement.querySelector('.inc-call-overlay').classList.remove('active');
                const stateBox = this.domElement.querySelector('.active-call-state');
                if (stateBox) stateBox.style.display = 'none';
                this.domElement.querySelector('.phone-call-trigger').style.display = 'block';
                this.domElement.querySelector('.dialer-pad').style.display = 'grid';
                this.domElement.querySelector('.dialer-output').innerText = '';
                this.activeCallData = null;
            }

            getLocalMessagesStore() {
                if(!this.currentSim) return {};
                if(!NetworkHub.sims[this.currentSim].messages) {
                    NetworkHub.sims[this.currentSim].messages = {};
                }
                return NetworkHub.sims[this.currentSim].messages;
            }

            saveLocalSMS(simContext, partyNumber, direction, body) {
                if(!NetworkHub.sims[simContext].messages) NetworkHub.sims[simContext].messages = {};
                const db = NetworkHub.sims[simContext].messages;
                if(!db[partyNumber]) db[partyNumber] = [];
                db[partyNumber].push({ direction, text: body, timestamp: new Date() });
            }

            receiveSMS(fromNum, body) {
                if(!this.currentSim) return;
                this.saveLocalSMS(this.currentSim, fromNum, 'rcvd', body);
                
                if(this.activeApp === 'messages') {
                    this.renderMessageThreadsList();
                    if(this.activeChatNum === fromNum) {
                        this.openChatThread(fromNum);
                    }
                } else {
                    this.unreadNotifications = true;
                    this.updateStatusBar();
                }
            }

            renderMessageThreadsList() {
                const container = this.domElement.querySelector('.msg-threads');
                container.innerHTML = '';
                if(!this.currentSim) {
                    container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">NO ACTIVE NETWORK SIM ENCRYPTED</div>';
                    return;
                }

                const db = this.getLocalMessagesStore();
                const threads = Object.keys(db);
                if(threads.length === 0) {
                    container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">Secure SMS Vault Empty</div>';
                    return;
                }

                threads.forEach(num => {
                    const row = document.createElement('div');
                    row.className = 'thread-row';
                    const lastMsg = db[num][db[num].length - 1];
                    const nameLabel = this.resolveName(num);
                    row.innerHTML = `<strong>${nameLabel === num ? '+1 ('+num+')' : nameLabel}</strong><div style="font-size:10px; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${lastMsg.text}</div>`;
                    row.addEventListener('click', () => this.openChatThread(num));
                    container.appendChild(row);
                });
            }

            openChatThread(targetNum) {
                this.activeChatNum = targetNum;
                this.domElement.querySelector('.msg-thread-selector').style.display = 'none';
                const chatContainer = this.domElement.querySelector('.msg-active-chat');
                chatContainer.style.display = 'flex';
                
                const stream = chatContainer.querySelector('.chat-stream');
                stream.innerHTML = '';
                
                const db = this.getLocalMessagesStore();
                const history = db[targetNum] || [];
                
                history.forEach(msg => {
                    const bub = document.createElement('div');
                    bub.className = `chat-bubble ${msg.direction}`;
                    bub.innerText = msg.text;
                    stream.appendChild(bub);
                });
                stream.scrollTop = stream.scrollHeight;
            }

            renderSocialAppView() {
                const authScreen = this.domElement.querySelector('.soc-auth-screen');
                const mainScreen = this.domElement.querySelector('.soc-main-screen');
                const bar = this.domElement.querySelector('.soc-acc-bar');
                
                bar.innerHTML = '';
                
                this.socialAccountsCache.forEach(acc => {
                    const btn = document.createElement('div');
                    btn.className = `mini-avatar ${this.activeSocialUser === acc ? 'active' : ''}`;
                    btn.innerText = acc;
                    btn.addEventListener('click', () => {
                        this.activeSocialUser = acc;
                        this.renderSocialAppView();
                    });
                    bar.appendChild(btn);
                });

                if(this.socialAccountsCache.length < 5) {
                    const addBtn = document.createElement('div');
                    addBtn.className = 'mini-avatar';
                    addBtn.innerText = ' [ + Auth ]';
                    addBtn.style.borderColor = '#222';
                    addBtn.addEventListener('click', () => {
                        this.activeSocialUser = null;
                        this.renderSocialAppView();
                    });
                    bar.appendChild(addBtn);
                }

                if(!this.activeSocialUser) {
                    mainScreen.style.display = 'none';
                    authScreen.style.display = 'flex';
                } else {
                    authScreen.style.display = 'none';
                    mainScreen.style.display = 'flex';
                    this.refreshSocialFeed();
                }
            }

            refreshSocialFeed() {
                const timeline = this.domElement.querySelector('.soc-timeline');
                if(!timeline) return;
                timeline.innerHTML = '';
                
                NetworkHub.socialPosts.forEach(post => {
                    const block = document.createElement('div');
                    block.className = 'soc-post';
                    block.innerHTML = `<div class="soc-handle">${post.sender}</div><div style="word-break:break-all;">${post.content}</div>`;
                    timeline.appendChild(block);
                });
            }
        }

        // Initialize Simulator Workspace components on execution load
        window.onload = () => {
            NetworkHub.init();
            Workspace.init();
            
            // Post-setup model dynamic options injection for model-specific wallpapers
            Object.values(Workspace.devices).forEach(dev => {
                const wpSelect = dev.domElement.querySelector('.settings-wallpaper-selector');
                if (dev.model === 'm-5' || dev.model === 'm-5c') {
                    const opt = document.createElement('option');
                    opt.value = 'm5_exclusive';
                    opt.innerText = 'Model 5 Stripe (SVG)';
                    wpSelect.appendChild(opt);
                } else if (dev.model === 'm-7' || dev.model === 'm-8' || dev.model === 'm-8p') {
                    const opt = document.createElement('option');
                    opt.value = 'm78_exclusive';
                    opt.innerText = 'Model 7/8 Fluid Wave (SVG)';
                    wpSelect.appendChild(opt);
                } else if (dev.model === 'm-x') {
                    const opt = document.createElement('option');
                    opt.value = 'mx_exclusive';
                    opt.innerText = 'Model X Cyber Flare (SVG)';
                    wpSelect.appendChild(opt);
                }
            });
        };
    </script>
</body>
</html>
