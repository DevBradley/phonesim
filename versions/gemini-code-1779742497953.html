<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network & Device Workspace Simulation</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --bg-tertiary: #1a1a1a;
            --border-color: #2a2a2a;
            --text-main: #e0e0e0;
            --text-muted: #777777;
            --accent: #555555;
            --accent-active: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Top Diagnostics Control Panel */
        #control-panel {
            height: 180px;
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            z-index: 10;
            padding: 10px;
            gap: 15px;
        }

        .panel-section {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        .panel-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 3px;
        }

        #sys-controls { width: 260px; }
        #sim-factory { width: 300px; }
        #network-logger { flex-grow: 1; }

        .log-stream {
            font-size: 11px;
            color: #00ff00;
            overflow-y: auto;
            flex-grow: 1;
            background: #050505;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }

        .log-entry { margin-bottom: 3px; white-space: nowrap; }

        button, select, input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 2px;
        }

        button:hover {
            background: var(--border-color);
            border-color: var(--text-muted);
        }

        input { cursor: text; }

        /* Workspace Grid (Infinite Pan Canvas) */
        #workspace-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #workspace-container:active { cursor: grabbing; }

        #workspace-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 5000px;
            height: 5000px;
            transform-origin: 0 0;
        }

        /* 3D Phone Chassis Styles */
        .phone-wrapper {
            position: absolute;
            perspective: 1000px;
            width: 260px;
            height: 510px;
            z-index: 5;
        }

        /* Model Scaling Layouts */
        .phone-wrapper.m-5 { width: 230px; height: 460px; }
        .phone-wrapper.m-5c { width: 230px; height: 460px; }
        .phone-wrapper.m-7 { width: 250px; height: 490px; }
        .phone-wrapper.m-8 { width: 250px; height: 490px; }
        .phone-wrapper.m-8p { width: 265px; height: 520px; }
        .phone-wrapper.m-x { width: 265px; height: 535px; }

        .phone-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .phone-wrapper.flipped .phone-card {
            transform: rotateY(180deg);
        }

        .phone-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 28px;
            border: 4px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Front Face Architecture */
        .phone-front {
            background: #111111;
            color: var(--text-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Cellular Antenna Band Engineering Lines */
        .phone-back .antenna-line.horiz-top { top: 55px; left: 0; width: 100%; height: 2px; background: rgba(0,0,0,0.3); }
        .phone-back .antenna-line.horiz-bottom { bottom: 55px; left: 0; width: 100%; height: 2px; background: rgba(0,0,0,0.3); }

        /* Chassis Framework Variant Profiles */
        .m-5 .phone-front { border-radius: 24px; }
        .m-5c .phone-front { border-radius: 26px; }
        .m-7 .phone-front { }
        .m-8 .phone-front { }
        .m-8p .phone-front { }
        
        /* Model X Dynamic Layout Screen Structure */
        .m-x .phone-front { border-radius: 40px; padding: 4px; }
        .m-x .top-bezel { height: 32px; background: transparent !important; z-index: 15; }
        .m-x .notch {
            width: 110px; height: 22px; background: #000 !important; border-radius: 0 0 12px 12px;
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .m-x .speaker-grille { width: 35px; height: 3px; background: #222; }
        .m-x .front-cam { position: static; width: 6px; height: 6px; background: #111133; }
        .m-x .bottom-bezel { display: none !important; }
        .m-x .screen { border-radius: 34px; border: none; }

        /* System Bezels */
        .top-bezel {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .speaker-grille {
            width: 45px;
            height: 4px;
            background: #222;
            border-radius: 2px;
        }
        .front-cam {
            width: 7px;
            height: 7px;
            background: #1a1a2e;
            border-radius: 50%;
            position: absolute;
            left: 70px;
        }

        .bottom-bezel {
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .home-button {
            width: 34px;
            height: 34px;
            border: 1px solid #333;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle, #151515 0%, #0a0a0a 100%);
        }

        /* Screen Architecture */
        .screen {
            flex-grow: 1;
            background: #000;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .status-bar {
            height: 20px;
            background: rgba(8, 8, 8, 0.75);
            font-size: 9px;
            padding: 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(17, 17, 17, 0.3);
            color: var(--text-muted);
            z-index: 12;
        }
        .m-x .status-bar { height: 26px; padding-top: 6px; background: rgba(0, 0, 0, 0.75); }

        .status-left, .status-right { display: flex; gap: 4px; align-items: center; }

        .app-space {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* System App Containers */
        .app-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            z-index: 5;
        }
        .app-view.active { display: flex; }

        .app-header {
            height: 32px;
            background: #0d0d0d;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 8px;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
        }

        .app-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-direction: column;
            font-size: 11px;
        }

        /* Home Indicator Bar for Model X Layout */
        .home-bar {
            display: none;
            width: 110px; height: 4px; background: #888; border-radius: 2px;
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            z-index: 100; cursor: pointer;
        }
        .m-x .home-bar { display: block; }

        /* OS Dock / Grid Launcher */
        .launcher-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }
        .app-icon {
            background: rgba(13, 13, 13, 0.75);
            border: 1px solid var(--border-color);
            height: 65px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 10px;
            gap: 4px;
        }
        .app-icon:hover { background: rgba(21, 21, 21, 0.9); }
        .app-icon span { font-size: 18px; }

        /* Phone App Elements */
        .dialer-output {
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 6px;
            text-align: right;
            font-size: 16px;
            margin-bottom: 8px;
            min-height: 30px;
            letter-spacing: 1px;
        }
        .dialer-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }
        .dial-btn {
            background: #0c0c0c;
            border: 1px solid #1e1e1e;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
        }
        .dial-btn:hover { background: #1a1a1a; }
        .call-actions { display: flex; gap: 5px; }

        .inc-call-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
        .inc-call-overlay.active { display: flex; }

        /* Messaging Subsystem */
        .msg-threads { display: flex; flex-direction: column; gap: 4px; }
        .thread-row {
            padding: 6px; background: #090909; border: 1px solid #151515; cursor: pointer;
        }
        .chat-stream { flex-grow: 1; overflow-y: auto; background: #030303; border: 1px solid #111; padding: 4px; margin-bottom: 4px; }
        .chat-bubble { max-width: 85%; padding: 4px 6px; margin-bottom: 4px; border-radius: 4px; word-break: break-all;}
        .chat-bubble.sent { background: #222; align-self: flex-end; }
        .chat-bubble.rcvd { background: #0f1c0f; align-self: flex-start; border: 1px solid #1b331b; }

        /* Social Network UI */
        .soc-acc-bar {
            display: flex; gap: 3px; background: #0a0a0a; padding: 4px; border-bottom: 1px solid #1a1a1a; overflow-x: auto;
        }
        .mini-avatar {
            font-size: 9px; padding: 2px 4px; background: #151515; border: 1px solid #333; cursor: pointer; white-space: nowrap;
        }
        .mini-avatar.active { background: #333; color: #fff; }
        .soc-post {
            background: #0a0a0a; border: 1px solid #1a1a1a; padding: 6px; margin-bottom: 6px; border-radius: 2px;
        }
        .soc-handle { color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }

        /* Physical Back Face Architecture */
        .phone-back {
            transform: rotateY(180deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-radius: 28px;
            position: relative;
        }
        
        /* Shell Finishes / Colors Rules */
        .phone-card[data-color="matte-black"] .phone-back { background: #141414; color: #888; border-color: #222; }
        .phone-card[data-color="industrial-gray"] .phone-back { background: #2e2e2e; color: #ccc; border-color: #444; }
        .phone-card[data-color="monochrome-white"] .phone-back { background: #dcdcdc; color: #222; border-color: #aaaaaa; }
        .phone-card[data-color="rose-gold"] .phone-back { background: #fad6d6; color: #444; border-color: #e0b2b2; }
        .phone-card[data-color="rose"] .phone-back { background: #ffb6c1; color: #444; border-color: #e8a2ad; }
        
        /* Vibrant Polycarbonate Finishes (Model 5c) */
        .phone-card[data-color="neon-blue"] .phone-back { background: #00a3e0; color: #fff; border-color: #0082b3; }
        .phone-card[data-color="lime-green"] .phone-back { background: #4cd964; color: #000; border-color: #3cb252; }
        .phone-card[data-color="coral-pink"] .phone-back { background: #ff4f6a; color: #fff; border-color: #e03b54; }
        .phone-card[data-color="canary-yellow"] .phone-back { background: #ffcc00; color: #000; border-color: #e6b800; }

        /* Front Bezels Non-Full Touchscreen Adaptive Painting Rules */
        .phone-card[data-front-theme="black"] .phone-front { background: #0c0c0c; border-color: inherit; }
        .phone-card[data-front-theme="black"] .top-bezel, .phone-card[data-front-theme="black"] .bottom-bezel { background: #0c0c0c; color: #fff; }
        .phone-card[data-front-theme="white"] .phone-front { background: #eaeaea; border-color: inherit; color: #222; }
        .phone-card[data-front-theme="white"] .top-bezel, .phone-card[data-front-theme="white"] .bottom-bezel { background: #eaeaea; color: #222; }
        .phone-card[data-front-theme="white"] .status-bar { background: rgba(220, 220, 220, 0.85); color: #333; }

        /* Hardware Side Tray Switch Sim Trigger */
        .hardware-sim-tray-bracket {
            position: absolute;
            right: -6px;
            top: 180px;
            width: 6px;
            height: 35px;
            background: #444;
            border: 1px solid #222;
            border-radius: 0 3px 3px 0;
            cursor: pointer;
            z-index: 20;
        }
        .hardware-sim-tray-bracket:hover {
            background: #ffcc00;
        }

        .cam-housing {
            background: #0a0a0a;
            border: 2px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .m-5 .cam-housing, .m-5c .cam-housing, .m-7 .cam-housing, .m-8 .cam-housing, .m-8p .cam-housing {
            width: 28px; height: 28px; border-radius: 50%; align-self: flex-start; margin-right: auto;
        }
        .m-x .cam-housing {
            width: 26px; height: 55px; border-radius: 13px; align-self: flex-start; margin-right: auto; gap: 6px; padding: 5px 0; flex-direction: column;
        }
        .lens { width: 10px; height: 10px; background: #05101a; border-radius: 50%; border: 1px solid #111; }

        .hardware-info { text-align: center; font-size: 9px; text-transform: uppercase; line-height: 14px; color: inherit; opacity: 0.7; }

        .sim-tray-assembly {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 6px;
        }

        .sim-selector-node {
            width: 140px; margin-bottom: 4px; font-size: 10px; background: #000; color: #fff; border: 1px solid #555;
        }

        /* Window Overlay Utilitarian Elements */
        .utility-row { display: flex; gap: 4px; margin-bottom: 4px; }
        .utility-row input { flex-grow: 1; }
        .flex-fill { flex-grow: 1; }
        
        /* Floating HUD metrics on devices */
        .spatial-hud {
            position: absolute; bottom: -35px; left: 0; width: 100%;
            text-align: center; font-size: 10px; color: var(--text-muted);
            pointer-events: none; line-height: 14px;
        }

        .flip-tab {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 2px 6px;
            font-size: 8px; border-radius: 3px; color: #aaa; cursor: pointer;
        }
        .flip-tab:hover { color: #fff; background: #000; }

        /* Router Elements Matrix Profiles */
        .router-wrapper {
            position: absolute;
            width: 120px;
            height: 90px;
            background: #181818;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 8px;
            font-size: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.8);
            cursor: move;
            z-index: 4;
        }
        .router-antenna {
            position: absolute; top: -15px; width: 3px; height: 15px; background: #444;
        }
        .router-antenna.a1 { left: 20px; }
        .router-antenna.a2 { right: 20px; }
        .router-led {
            width: 5px; height: 5px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 4px;
        }

        /* Drawing Box Marquee Infrastructure */
        #selection-marquee {
            position: absolute;
            border: 1px dashed #ffcc00;
            background: rgba(255, 204, 0, 0.15);
            pointer-events: none;
            display: none;
            z-index: 1000;
        }

        .selected-group-node {
            box-shadow: 0 0 0 2px #ffcc00 !important;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="panel-section" id="sys-controls">
            <h3>System Controls</h3>
            <div style="display: flex; flex-direction: column; gap: 4px; overflow-y:auto; flex-grow:1;">
                <div>
                    <label style="font-size:9px; color:var(--text-muted)">CHASSIS TYPE:</label>
                    <select id="spawn-model" style="width:100%; margin-top:1px;" onchange="UiEngine.handleModelChange()">
                        <option value="m-5">Model 5 (Legacy Metal)</option>
                        <option value="m-5c">Model 5c (Polycarbonate)</option>
                        <option value="m-7">Model 7 (Compact)</option>
                        <option value="m-8">Model 8 (Glass-Back)</option>
                        <option value="m-8p">Model 8 Plus (Large Glass)</option>
                        <option value="m-x">Model X (Dynamic Screen)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:9px; color:var(--text-muted)">SHELL FINISH / COLOR:</label>
                    <select id="spawn-color" style="width:100%; margin-top:1px;">
                        <option value="matte-black">Matte Black</option>
                        <option value="industrial-gray">Industrial Gray</option>
                        <option value="monochrome-white">Monochrome White</option>
                        <option value="rose-gold">Rose Gold</option>
                        <option value="rose">Rose</option>
                    </select>
                </div>
                <div style="display:flex; gap:4px; margin-top:2px;">
                    <button onclick="Workspace.spawnDevice()" style="flex-grow:1;">+ SPAWN PHONE</button>
                    <button onclick="Workspace.spawnRouter()">+ ROUTER</button>
                </div>
                <div style="display:flex; gap:4px; align-items:center; justify-content:space-between; margin-top:2px;">
                    <span style="font-size:9px; color:var(--text-muted)">GRID ZOOM:</span>
                    <div style="display:flex; gap:2px;">
                        <button onclick="Workspace.adjustZoom(0.1)">IN</button>
                        <button onclick="Workspace.adjustZoom(-0.1)">OUT</button>
                        <button onclick="Workspace.resetZoom()">1:1</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-section" id="sim-factory">
            <h3>SIM Card Provisioning Factory</h3>
            <div style="display: flex; flex-direction: column; gap: 6px; flex-grow:1; justify-content:center;">
                <div class="utility-row">
                    <input type="text" id="sim-msisdn" placeholder="Custom Phone No." maxlength="10">
                    <button onclick="NetworkHub.generateSim()">GENERATE</button>
                </div>
                <div style="font-size:10px; color:var(--text-muted); text-align:center;">Active Cards In Circulation: <span id="sim-count" style="color:var(--text-main)">0</span></div>
            </div>
        </div>

        <div class="panel-section" id="network-logger">
            <h3>Global Network Topology Packet Stream</h3>
            <div class="log-stream" id="log-container">
                <div class="log-entry">[System] Routing Engine Initialized. Latency set to 15ms per 100px vector distance. Mode: Multi-Select Marquee Draggable (Hold Shift to Draw Area).</div>
            </div>
        </div>
    </div>

    <div id="workspace-container">
        <div id="workspace-canvas"></div>
        <div id="selection-marquee"></div>
    </div>

    <script>
        // Utilities for UI Configuration Changes
        const UiEngine = {
            handleModelChange() {
                const model = document.getElementById('spawn-model').value;
                const colorSelect = document.getElementById('spawn-color');
                const currentChoice = colorSelect.value;
                colorSelect.innerHTML = '';
                
                if (model === 'm-5c') {
                    colorSelect.innerHTML = `
                        <option value="neon-blue">Neon Blue</option>
                        <option value="lime-green">Lime Green</option>
                        <option value="coral-pink">Coral Pink</option>
                        <option value="canary-yellow">Canary Yellow</option>
                    `;
                } else {
                    colorSelect.innerHTML = `
                        <option value="matte-black">Matte Black</option>
                        <option value="industrial-gray">Industrial Gray</option>
                        <option value="monochrome-white">Monochrome White</option>
                        <option value="rose-gold">Rose Gold</option>
                        <option value="rose">Rose</option>
                    `;
                    if (['matte-black', 'industrial-gray', 'monochrome-white', 'rose-gold', 'rose'].includes(currentChoice)) {
                        colorSelect.value = currentChoice;
                    }
                }
            }
        };

        // Central Core State Database Engine
        const NetworkHub = {
            sims: {}, 
            socialAccounts: {}, 
            socialPosts: [], 
            activeCalls: {}, 
            routers: {},
            netChatStore: [],
            gamePlayers: {},

            init() {
                this.socialAccounts["@network_ops"] = { handle: "@network_ops", pass: "123" };
                this.socialAccounts["@echo_bot"] = { handle: "@echo_bot", pass: "123" };
                
                this.socialPosts.push({ sender: "@network_ops", content: "Mainframe infrastructure testing completely operational. Latency routing active." });
                this.socialPosts.push({ sender: "@echo_bot", content: "Hello world. Grid virtualization is running steady." });
            },

            log(module, text) {
                const container = document.getElementById('log-container');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerText = `[${module}] ${text}`;
                container.appendChild(entry);
                container.scrollTop = container.scrollHeight;
            },

            generateSim() {
                const input = document.getElementById('sim-msisdn');
                let number = input.value.trim();
                if(!number) {
                    number = Math.floor(100000 + Math.random() * 900000).toString();
                }
                if(this.sims[number]) {
                    alert("MSISDN collision: Identity profile already provisioned.");
                    return;
                }
                this.sims[number] = {
                    phoneNumber: number,
                    allocatedTo: null, 
                    messages: {} 
                };
                this.log("Carrier", `SIM Registry Provisioned: +1 (${number})`);
                input.value = '';
                this.updateSimCount();
                Workspace.refreshAllSimTrays();
            },

            updateSimCount() {
                document.getElementById('sim-count').innerText = Object.keys(this.sims).length;
            },

            calculateLatency(phoneA_Id, phoneB_Id) {
                const pA = Workspace.devices[phoneA_Id];
                const pB = Workspace.devices[phoneB_Id];
                if(!pA || !pB) return 0;
                
                const dx = pA.x - pB.x;
                const dy = pA.y - pB.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                const latency = Math.round((distance / 100) * 15);
                return { distance: Math.round(distance), latency: Math.max(5, latency) };
            },

            routeSMS(fromNum, toNum, message, originatingPhoneId) {
                const targetSim = this.sims[toNum];
                if(!targetSim || !targetSim.allocatedTo) {
                    this.log("Routing Engine", `Packet dropped: Target MSISDN +1 (${toNum}) unreachable.`);
                    return false;
                }

                const targetPhoneId = targetSim.allocatedTo;
                const metrics = this.calculateLatency(originatingPhoneId, targetPhoneId);

                this.log("Network", `Routing SMS [${fromNum} -> ${toNum}] | Dist: ${metrics.distance}px -> Latency Delay: ${metrics.latency}ms`);
                
                setTimeout(() => {
                    const targetDeviceInstance = Workspace.devices[targetPhoneId];
                    if(targetDeviceInstance) {
                        targetDeviceInstance.receiveSMS(fromNum, message);
                    }
                }, metrics.latency);
                return true;
            },

            routeNetChat(fromNum, toNum, text) {
                Object.values(Workspace.devices).forEach(dev => {
                    if (dev.currentSim === toNum) {
                        dev.receiveNetChat(fromNum, text);
                    }
                });
            },

            initiateCall(fromNum, toNum, originatingPhoneId) {
                const callerDevice = Workspace.devices[originatingPhoneId];
                if(callerDevice) {
                    callerDevice.callRecents.unshift({ number: toNum, type: 'outgoing', timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
                    callerDevice.renderCallRecents();
                }

                const targetSim = this.sims[toNum];
                if(!targetSim || !targetSim.allocatedTo) {
                    this.log("Switchboard", `Call Failed: +1 (${toNum}) is out of service area.`);
                    return "FAILED";
                }

                const targetPhoneId = targetSim.allocatedTo;
                const targetDevice = Workspace.devices[targetPhoneId];
                if(targetDevice) {
                    targetDevice.callRecents.unshift({ number: fromNum, type: 'incoming', timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
                    targetDevice.renderCallRecents();
                }

                if(targetPhoneId === originatingPhoneId) return "BUSY";
                
                const metrics = this.calculateLatency(originatingPhoneId, targetPhoneId);
                this.log("Switchboard", `Establishing Call Path [${fromNum} -> ${toNum}] | Pipeline Delay: ${metrics.latency}ms`);

                setTimeout(() => {
                    if(targetDevice) {
                        targetDevice.triggerIncomingCall(fromNum, originatingPhoneId);
                    }
                }, metrics.latency);
                return "ROUTING";
            },

            connectCall(phoneIdA, phoneIdB) {
                this.activeCalls[phoneIdA] = phoneIdB;
                this.activeCalls[phoneIdB] = phoneIdA;
                this.log("Switchboard", `Circuit Connection Locked: Device ID #${phoneIdA} <=> Device ID #${phoneIdB}`);
                
                if(Workspace.devices[phoneIdA]) Workspace.devices[phoneIdA].establishCallConnection();
                if(Workspace.devices[phoneIdB]) Workspace.devices[phoneIdB].establishCallConnection();
            },

            terminateCall(phoneId) {
                const peerId = this.activeCalls[phoneId];
                delete this.activeCalls[phoneId];
                if(peerId) {
                    delete this.activeCalls[peerId];
                    const peerDevice = Workspace.devices[peerId];
                    if(peerDevice) peerDevice.hangupCall(false);
                }
            },

            publishSocialPost(sender, content, originatingPhoneId) {
                this.socialPosts.unshift({ sender, content });
                Object.values(Workspace.devices).forEach(dev => {
                    const metrics = this.calculateLatency(originatingPhoneId, dev.id);
                    setTimeout(() => { dev.refreshSocialFeed(); }, metrics.latency);
                });
                this.log("NetSpace DB", `${sender} updated status globally across cluster array.`);
            }
        };

        // Infinite Workspace Vector Architecture
        const Workspace = {
            devices: {},
            routers: {},
            deviceCount: 0,
            routerCount: 0,
            canvas: null,
            panX: 100,
            panY: 50,
            zoom: 1.0,
            isDragging: false,
            isDrawingArea: false,
            startX: 0, startY: 0,
            marquee: null,
            selectedNodes: [],

            init() {
                this.canvas = document.getElementById('workspace-canvas');
                this.marquee = document.getElementById('selection-marquee');
                const container = document.getElementById('workspace-container');

                container.addEventListener('mousedown', (e) => {
                    const isShift = e.shiftKey;
                    if(e.target === container || e.target === this.canvas) {
                        if (isShift) {
                            this.isDrawingArea = true;
                            const rect = container.getBoundingClientRect();
                            this.startX = e.clientX - rect.left;
                            this.startY = e.clientY - rect.top;
                            this.marquee.style.left = `${this.startX}px`;
                            this.marquee.style.top = `${this.startY}px`;
                            this.marquee.style.width = '0px';
                            this.marquee.style.height = '0px';
                            this.marquee.style.display = 'block';
                            
                            // Clear old selections
                            this.clearSelection();
                        } else {
                            this.isDragging = true;
                            this.startX = e.clientX - this.panX;
                            this.startY = e.clientY - this.panY;
                        }
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    const containerRect = container.getBoundingClientRect();
                    if (this.isDragging) {
                        this.panX = e.clientX - this.startX;
                        this.panY = e.clientY - this.startY;
                        this.updateTransform();
                    } else if (this.isDrawingArea) {
                        const currentX = e.clientX - containerRect.left;
                        const currentY = e.clientY - containerRect.top;
                        
                        const x = Math.min(this.startX, currentX);
                        const y = Math.min(this.startY, currentY);
                        const w = Math.abs(this.startX - currentX);
                        const h = Math.abs(this.startY - currentY);

                        this.marquee.style.left = `${x}px`;
                        this.marquee.style.top = `${y}px`;
                        this.marquee.style.width = `${w}px`;
                        this.marquee.style.height = `${h}px`;
                    }
                });

                window.addEventListener('mouseup', (e) => {
                    if (this.isDragging) {
                        this.isDragging = false;
                    } if (this.isDrawingArea) {
                        this.isDrawingArea = false;
                        this.marquee.style.display = 'none';
                        this.evaluateMarqueeSelection();
                    }
                });

                this.updateTransform();

                // Spawn initial system node infrastructures
                this.spawnDevice(150, 80, "m-5", "industrial-gray");
                this.spawnDevice(450, 80, "m-5c", "neon-blue");
                this.spawnDevice(750, 80, "m-x", "matte-black");
                this.spawnRouter(450, 400, "Default_Gateway_5G");
            },

            updateTransform() {
                this.canvas.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoom})`;
            },

            adjustZoom(delta) {
                this.zoom = Math.max(0.3, Math.min(2.0, this.zoom + delta));
                this.updateTransform();
                NetworkHub.log("Workspace", `Zoom matrix set to ${Math.round(this.zoom * 100)}%`);
            },

            resetZoom() {
                this.zoom = 1.0;
                this.updateTransform();
            },

            clearSelection() {
                this.selectedNodes.forEach(node => {
                    if(node.domElement) node.domElement.classList.remove('selected-group-node');
                });
                this.selectedNodes = [];
            },

            evaluateMarqueeSelection() {
                const mRect = this.marquee.getBoundingClientRect();
                if(mRect.width < 5 || mRect.height < 5) return;

                this.selectedNodes = [];
                
                // Scan devices
                Object.values(this.devices).forEach(dev => {
                    const dRect = dev.domElement.getBoundingClientRect();
                    if (dRect.left >= mRect.left && dRect.right <= mRect.right &&
                        dRect.top >= mRect.top && dRect.bottom <= mRect.bottom) {
                        this.selectedNodes.push(dev);
                        dev.domElement.classList.add('selected-group-node');
                    }
                });

                // Scan routers
                Object.values(this.routers).forEach(rot => {
                    const rRect = rot.domElement.getBoundingClientRect();
                    if (rRect.left >= mRect.left && rRect.right <= mRect.right &&
                        rRect.top >= mRect.top && rRect.bottom <= mRect.bottom) {
                        this.selectedNodes.push(rot);
                        rot.domElement.classList.add('selected-group-node');
                    }
                });

                if(this.selectedNodes.length > 0) {
                    NetworkHub.log("Workspace", `Marquee bounds captured ${this.selectedNodes.length} active canvas devices. You can drag them as a cluster array.`);
                }
            },

            spawnDevice(x = null, y = null, modelClass = null, chosenColor = null) {
                this.deviceCount++;
                const id = this.deviceCount;
                const posX = x !== null ? x : Math.abs(this.panX) + 120 + (Math.random() * 80);
                const posY = y !== null ? y : Math.abs(this.panY) + 40 + (Math.random() * 40);
                const model = modelClass || document.getElementById('spawn-model').value;
                const color = chosenColor || document.getElementById('spawn-color').value;

                const phone = new PhoneInstance(id, posX, posY, model, color);
                this.devices[id] = phone;
                this.canvas.appendChild(phone.domElement);
                NetworkHub.log("Workspace", `Spawned Model ${model.replace('m-','').toUpperCase()} Device Array Stack #${id} in [${color}] Finish.`);
            },

            spawnRouter(x = null, y = null, ssid = null) {
                this.routerCount++;
                const id = this.routerCount;
                const posX = x !== null ? x : Math.abs(this.panX) + 200 + (Math.random() * 100);
                const posY = y !== null ? y : Math.abs(this.panY) + 200 + (Math.random() * 100);
                const routerSsid = ssid || `WiFi_Router_Node_${id}`;

                const router = new RouterInstance(id, posX, posY, routerSsid);
                this.routers[id] = router;
                this.canvas.appendChild(router.domElement);
                NetworkHub.log("Workspace", `Provisioned Wireless Local Area Gateway Router #${id} [SSID: ${routerSsid}]`);
                Object.values(this.devices).forEach(dev => dev.populateWifiDropdownOptions());
            },

            refreshAllSimTrays() {
                Object.values(this.devices).forEach(dev => dev.populateSimSelector());
            }
        };

            constructor(id, x, y, ssid) {

                this.buildArchitecture();

            buildArchitecture() {
                this.domElement.innerHTML = `
                    <div class="router-antenna a1"></div>

                    <div style="font-weight:bold; color:#fff; margin-bottom:4px; font-size:11px;">📡 WI-FI ROUTER</div>

                    <div><span class="router-led"></span><span style="font-size:9px;">AP MODE ACTIVE</span></div>
                `;
            }

            bindEvents() {
                let dragStart = {x:0, y:0};
                const onMouseDown = (e) => {
                    e.stopPropagation();
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;
                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                };

                const onMouseMove = (e) => {
                    const dx = (e.clientX - dragStart.x) / Workspace.zoom;
                    const dy = (e.clientY - dragStart.y) / Workspace.zoom;
                    dragStart.x = e.clientX;
                    dragStart.y = e.clientY;

                    // Support single or group drag
                    if (Workspace.selectedNodes.includes(this)) {
                        Workspace.selectedNodes.forEach(node => {
                            node.x += dx;
                            node.y += dy;
                            node.domElement.style.left = `${node.x}px`;
                            node.domElement.style.top = `${node.y}px`;
                            if(node.updateCoordsHud) node.updateCoordsHud();
                        });
                    } else {
                        this.x += dx;
                        this.y += dy;
                        this.domElement.style.left = `${this.x}px`;
                        this.domElement.style.top = `${this.y}px`;
                    }
                };

                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };

                this.domElement.addEventListener('mousedown', onMouseDown);
            }
        }

                        <div class="phone-face phone-back">

                            <div class="antenna-line horiz-bottom"></div>

                            <div class="cam-housing">${camLayout}</div>
                            <div class="hardware-info">
                                <div style="font-weight: bold; margin-bottom: 2px;">${modelLabel}</div>
                                <div>Physical Layer Stack Node: #${this.id}</div>

                            <div class="sim-tray-assembly">
                                <div style="font-size:9px; color:inherit; opacity:0.6; font-weight:bold; text-transform:uppercase; margin-bottom:2px;">Hardware Sim Tray Assembly</div>
                                <select class="sim-selector-node"></select>
                                <button class="sim-tray-slot-btn" style="width:100%; font-size:10px; margin-top:2px; font-weight:bold; background:#222;">SLOT & ENGAGE SIM CARD</button>

                    <div class="spatial-hud">
                        NODE-00${this.id}<br>
                        <span class="hud-coords">(${Math.round(this.x)}, ${Math.round(this.y)})</span>
